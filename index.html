<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lessing Coach Ansichten V8</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
.view{display:none;width:100vw;height:100vh;position:relative}
.view.active{display:block}
.view img{width:100vw;height:100vh;object-fit:fill;display:block}
.hotspot{position:absolute;z-index:10;cursor:pointer}
.back{left:0;top:0;width:300px;height:100vh}
.card1{left:18%;top:35%;width:25%;height:45%}
.card2{left:43%;top:35%;width:25%;height:45%}
.card3{left:68%;top:35%;width:25%;height:45%}
.menuHome{left:0;top:140px;width:300px;height:80px}
.menuChat{left:0;top:300px;width:300px;height:80px}
.menuKI{left:0;top:340px;width:300px;height:80px}
</style>
</head>
<body>
<div id="start" class="view active">
<img src="assets/start.png">
<div class="hotspot card1" onclick="show('chat')"></div>
<div class="hotspot card2" onclick="show('start')"></div>
<div class="hotspot card3" onclick="show('ki')"></div>
<div class="hotspot menuChat" onclick="show('chat')"></div>
<div class="hotspot menuKI" onclick="show('ki')"></div>
</div>
<div id="ki" class="view">
<img src="assets/ki.png">
<div class="hotspot back" onclick="show('start')"></div>
<div class="hotspot menuHome" onclick="show('start')"></div>
</div>
<div id="chat" class="view">
<img src="assets/chat.png">
<div class="hotspot back" onclick="show('start')"></div>
<div class="hotspot menuHome" onclick="show('start')"></div>
</div>
<script>
function show(p){
document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
document.getElementById(p).classList.add('active');
}
</script>
</body>
</html>
