<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lessing Coach Ansichten</title>
<style>
body{margin:0;font-family:Arial;background:#f5f7fb;color:#12233b}
nav{padding:15px;text-align:center}
button{padding:12px 20px;margin:5px;border:0;border-radius:12px;background:#1769ff;color:white;cursor:pointer}
img{width:100%;max-width:1536px;border-radius:20px;display:none;margin:auto;box-shadow:0 10px 30px #0002}
.mobile{max-width:430px}
</style>
</head>
<body>
<nav>
<button onclick="show('ki')">KI Ansicht</button>
<button onclick="show('start')">Startseite</button>
<button onclick="show('chat')">Chat Ansicht</button>
</nav>
<img id="ki" src="assets/ki-chat-desktop.png">
<img id="start" src="assets/startseite-desktop.png">
<img id="chat" src="assets/kontakt-chat-desktop.png">
<script>
function show(id){
document.querySelectorAll("img").forEach(x=>x.style.display="none");
document.getElementById(id).style.display="block";
}
show("ki");
</script>
</body>
</html>
