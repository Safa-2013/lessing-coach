<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Lessing Schulportal</title>
<style>
body{font-family:Arial;margin:0;background:#f5f8fc;color:#18324a}
header{background:#155487;color:white;padding:20px;font-size:24px}
.container{max-width:1100px;margin:30px auto;background:white;padding:25px;border-radius:20px}
.menu button{margin:5px;padding:12px;border:0;border-radius:10px;background:#e8f1fa}
.card{margin-top:20px;padding:20px;border-radius:15px;background:#f1f6fb}
input,textarea,select{padding:12px;width:90%;margin:5px;border-radius:8px;border:1px solid #ccc}
</style>
</head>
<body>
<header>Lessing Schulportal</header>
<div class="container">
<div class="menu">
<button>KI-Chat</button>
<button>Terminplaner</button>
<button>Lernpläne</button>
<button>Fächer</button>
</div>

<div class="card">
<h2>KI-Chat & Lernhilfe</h2>
<input placeholder="Schreibe eine Nachricht...">
<button>Senden</button>
</div>

<div class="card">
<h2>Terminplaner</h2>
<input placeholder="Termin">
<input type="date">
<select>
<option>Mathe</option>
<option>Deutsch</option>
<option>Englisch</option>
<option>Chemie</option>
<option>Physik</option>
<option>Biologie</option>
</select>
<textarea placeholder="Notizen"></textarea>
</div>

<div class="card">
<h2>Lernplan erstellen</h2>
<p>Fach auswählen → Ziel eingeben → KI erstellt Lernplan.</p>
</div>
</div>
</body>
</html>
