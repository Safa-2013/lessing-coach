<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Lessing KI</title>
<style>
body{font-family:Arial;background:#f7f9fc;margin:0}
.chat{max-width:900px;margin:40px auto;background:white;border-radius:20px;padding:25px}
.msg{padding:15px;border-radius:15px;margin:12px 0}
.user{background:#d9ecff}
.ai{background:#fff;border:1px solid #ddd}
.input{display:flex;gap:10px}
input{flex:1;padding:15px;border-radius:12px;border:1px solid #ccc}
button{padding:15px 25px;background:#174d7c;color:white;border:0;border-radius:12px}
</style>
</head>
<body>
<div class="chat">
<h1>KI-Chat & Lernhilfe</h1>
<div id="chat"></div>
<div class="input">
<input id="q" placeholder="Schreibe eine Nachricht...">
<button onclick="send()">Senden</button>
</div>
</div>
<script>
async function send(){
 const q=document.getElementById("q");
 const text=q.value;
 if(!text)return;
 document.getElementById("chat").innerHTML += '<div class="msg user">'+text+'</div>';
 q.value="";
 document.getElementById("chat").innerHTML += '<div class="msg ai">Lessing KI schreibt...</div>';
 const r=await fetch("/api/lern-ki",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:text})});
 const d=await r.json();
 document.getElementById("chat").lastChild.innerHTML=d.answer||d.error;
}
</script>
</body>
</html>
