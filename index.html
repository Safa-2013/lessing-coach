<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />

  <style>
    :root {
      --bg: #07162d;
      --panel: rgba(5, 14, 28, 0.82);
      --accent: #ffd84b;
      --text: #f7fbff;
      --shadow: 0 18px 40px rgba(0,0,0,.45);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #11356c 0%, #07162d 52%, #030b17 100%);
      color: var(--text);
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    #stageWrap {
      position: relative;
      width: min(100vw - 20px, calc((100vh - 20px) * 16 / 9));
      height: min(calc((100vw - 20px) * 9 / 16), 100vh - 20px);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
      background: #05101f;
      border: 2px solid rgba(255,255,255,.14);
    }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
    }
    .screen.active { display: block; }

    .screen > img.bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .hotspot {
      position: absolute;
      background: transparent;
      border: 0;
      padding: 0;
      margin: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .hotspot:hover,
    .hotspot:focus-visible {
      outline: 3px solid rgba(255, 216, 75, 0.75);
      border-radius: 14px;
      background: rgba(255, 216, 75, 0.08);
    }

    .floating-back {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 50;
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      background: rgba(3, 12, 24, 0.86);
      color: white;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.14);
    }
    .floating-back:hover { background: rgba(18, 42, 76, .96); }

    .hint {
      position: fixed;
      right: 10px;
      bottom: 10px;
      z-index: 50;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(3, 12, 24, 0.86);
      color: #dcebff;
      font-size: 12px;
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 8px 22px rgba(0,0,0,.35);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%) translateY(120px);
      background: rgba(8, 16, 34, 0.96);
      color: white;
      padding: 14px 18px;
      border-radius: 14px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.1);
      z-index: 70;
      font-weight: 700;
      transition: transform .25s ease;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    .login-overlay {
      position: absolute;
      inset: 0;
    }

    .login-input {
      position: absolute;
      border: none;
      border-radius: 18px;
      background: rgba(8, 32, 70, 0.15);
      color: white;
      font-size: clamp(12px, 1.45vw, 26px);
      font-weight: 700;
      padding: 0 18px;
      outline: none;
      box-shadow: inset 0 0 0 2px rgba(64, 161, 255, 0.06);
    }
    .login-input::placeholder { color: rgba(255,255,255,.72); }
    .login-input:focus { background: rgba(10, 38, 82, 0.28); box-shadow: inset 0 0 0 2px rgba(103, 211, 255, .35); }

    .visually-hidden {
      position: absolute !important;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>

  <script>
    const labels = {
      lobby: 'Lobby',
      menu: 'Seitenleiste',
      shop: 'Shop',
      brawler: 'Brawler',
      drops: 'L-Drops / Mega Box',
      login: 'Anmeldung'
    };

    const screens = [...document.querySelectorAll('.screen')];
    const toastEl = document.getElementById('toast');
    const screenLabel = document.getElementById('screenLabel');
    const coachBack = document.getElementById('coachBack');

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toastEl.classList.remove('show'), 1900);
    }

    function setScreen(name) {
      screens.forEach(screen => screen.classList.toggle('active', screen.id === `screen-${name}`));
      screenLabel.textContent = labels[name] || name;
      location.hash = `#/screen/${name}`;
    }

    function navigate(name) { setScreen(name); }

    function initFromHash() {
      const match = location.hash.match(/#\/screen\/([a-z-]+)/i);
      if (match && labels[match[1]]) setScreen(match[1]);
      else setScreen('lobby');
    }

    document.querySelectorAll('[data-go]').forEach(btn => {
      btn.addEventListener('click', () => navigate(btn.dataset.go));
    });

    document.querySelectorAll('[data-toast]').forEach(btn => {
      btn.addEventListener('click', () => showToast(btn.dataset.toast));
    });

    document.getElementById('loginSubmit').addEventListener('click', () => {
      const username = document.getElementById('username').value.trim() || 'Gast';
      showToast(`Willkommen ${username}!`);
      setTimeout(() => navigate('lobby'), 320);
    });

    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('loginSubmit').click();
    });
    document.getElementById('username').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('loginSubmit').click();
    });

    coachBack.addEventListener('click', () => {
      if (window.history.length > 1) {
        history.back();
        setTimeout(() => {
          if (document.visibilityState === 'visible' && location.hash.includes('#/screen/')) {
            try { location.href = '/'; } catch (_) {}
          }
        }, 120);
      } else {
        try { location.href = '/'; } catch (_) { showToast('Zurück zum Terminplaner'); }
      }
    });

    window.addEventListener('hashchange', initFromHash);
    initFromHash();
  </script>
