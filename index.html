
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lessing Coach Ansicht</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
.view{display:none;width:100vw;height:100vh;position:relative}
.view img{width:100vw;height:100vh;object-fit:cover;display:block}
.active{display:block}
/* klickbare Bereiche auf der Startseite */
.hotspot{position:absolute;cursor:pointer;background:transparent}
.chat-btn{left:70%;top:35%;width:27%;height:42%}
.ki-btn{left:70%;top:35%;width:27%;height:42%}
</style>
</head>
<body>

<div id="start" class="view active">
<img src="assets/start.png">
<!-- rechte Karten -->
<div class="hotspot chat-btn" onclick="show('chat')"></div>
<div class="hotspot ki-btn" onclick="show('ki')"></div>
</div>

<div id="ki" class="view">
<img src="assets/ki.png">
</div>

<div id="chat" class="view">
<img src="assets/chat.png">
</div>

<script>
function show(id){
 document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
 document.getElementById(id).classList.add('active');
}
</script>
</body>
</html>
