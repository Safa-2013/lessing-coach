<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#071a34">
<title>Lessing Stars</title>
<style>
:root{
  --navy:#06162d;--navy2:#0b2d57;--blue:#1769bd;--blue2:#2f8eea;--line:#4e8bc8;
  --yellow:#ffd83f;--green:#31d65d;--red:#ef4e55;--purple:#9b4ce9;--cyan:#19b9e7;
  --text:#fff;--muted:#cfe1f8;--shadow:0 10px 28px #0007;
  --safe-t:max(8px,env(safe-area-inset-top));--safe-r:max(8px,env(safe-area-inset-right));
  --safe-b:max(8px,env(safe-area-inset-bottom));--safe-l:max(8px,env(safe-area-inset-left));
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030b18;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,input,select,textarea{font:inherit}
button{touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #fff;outline-offset:2px}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(145deg,#06172f,#0b3970)}
#loading{position:absolute;inset:0;z-index:999;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#1f6fc7,#07182f 58%,#030916);transition:opacity .3s}
#loading.hide{opacity:0;pointer-events:none}
.loader-card{text-align:center;min-width:min(520px,82vw)}
.logo{font-weight:900;font-size:clamp(32px,5vw,76px);line-height:.84;letter-spacing:-.04em;text-shadow:0 6px 0 #020814,0 10px 24px #0009}.logo span{display:block;color:#ffad27}.loadbar{margin:28px auto 0;height:13px;background:#06152b;border:2px solid #4186c9;border-radius:999px;overflow:hidden}.loadbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#36dc5b,#ffe141);animation:load 1.25s ease forwards}@keyframes load{to{width:100%}}
.screen{position:absolute;inset:0;display:none;overflow:hidden}.screen.active{display:block;animation:screenIn .22s ease}@keyframes screenIn{from{opacity:.35;transform:scale(.995)}to{opacity:1;transform:none}}
.game-shell{display:grid;grid-template-columns:15.4% 1fr;height:100%;background:linear-gradient(135deg,#081a34,#0c4d92)}
.side{position:relative;z-index:10;background:linear-gradient(180deg,#06162d,#09284e);border-right:3px solid #245b91;padding:2vh .9vw;display:flex;flex-direction:column;gap:.8vh;overflow:auto;scrollbar-width:none}.side::-webkit-scrollbar{display:none}
.brand{text-align:center;margin:0 0 1vh}.brand .logo{font-size:clamp(23px,2.6vw,45px)}
.nav{display:grid;gap:.75vh}.nav button{min-height:46px;border:2px solid #07121f;border-radius:12px;background:linear-gradient(#2b76bd,#153d70);box-shadow:0 4px 0 #031025;color:white;font-weight:850;font-size:clamp(10px,1.05vw,17px);padding:.65em .5em;cursor:pointer;text-align:left;display:flex;align-items:center;gap:.7em}.nav button:hover,.nav button.active{background:linear-gradient(#ffe65e,#efaa22);color:#07162e}.ico{display:inline-grid;place-items:center;min-width:1.8em;height:1.8em;border-radius:8px;background:#071c39;border:1px solid #69a9e6;color:#fff;font-weight:900;font-size:.9em}.nav button.active .ico,.nav button:hover .ico{background:#8e5b00;border-color:#ffe86f}
.content{position:relative;min-width:0;min-height:0;overflow:auto;background:radial-gradient(circle at 70% 0,#2b8ce633,transparent 34%)}
.topbar{position:sticky;top:0;z-index:20;height:10.8vh;min-height:70px;background:#06162df0;backdrop-filter:blur(8px);border-bottom:3px solid #1e5388;display:grid;grid-template-columns:1fr auto;align-items:center;padding:0 1.4vw;box-shadow:0 7px 18px #0005}.page-title{font-size:clamp(24px,2.7vw,48px);font-weight:900;letter-spacing:-.03em;text-shadow:0 3px #000}.hud{display:flex;align-items:center;gap:.55vw}.pill{background:#03070d;border:2px solid #244c75;border-radius:10px;min-width:82px;padding:.5em .72em;font-size:clamp(11px,1vw,17px);font-weight:850;display:flex;align-items:center;justify-content:center;gap:.45em;box-shadow:0 4px 0 #01050b}.pill i{width:15px;height:15px;border-radius:50%;display:block}.pill.coin i{background:#ffbd1c;border:2px solid #ffea79}.pill.gem i{background:#4ee26f;transform:rotate(45deg);border-radius:3px}.pill.power i{background:#a651e6;border-radius:4px}.pill.ticket i{background:#40a8ff;border-radius:3px}.menu-btn{width:50px;height:50px;border:2px solid #0b1b30;border-radius:11px;background:linear-gradient(#2c80cc,#19508b);color:#fff;font-size:28px;box-shadow:0 4px 0 #031025;cursor:pointer}
.page{padding:2.2vh 1.6vw 4vh}.section-title{font-size:clamp(20px,2vw,34px);font-weight:900;margin:0 0 1.3vh}.sub{color:var(--muted);font-weight:650}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.1vw}.panel{background:linear-gradient(145deg,#143e70,#0a284e);border:2px solid #4d8ac6;border-radius:18px;box-shadow:var(--shadow);padding:1.2vw}.panel h3{margin:.1em 0 .45em;font-size:clamp(17px,1.5vw,27px)}.panel p{margin:.35em 0;color:var(--muted);font-weight:650;line-height:1.45}
.btn{border:2px solid #071529;border-radius:12px;background:linear-gradient(#2e83ce,#174b84);box-shadow:0 4px 0 #031128;color:#fff;font-weight:850;padding:.72em 1em;cursor:pointer;min-height:44px}.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #031128}.btn.gold{background:linear-gradient(#ffe55a,#eda41b);color:#10213b}.btn.green{background:linear-gradient(#43e767,#18a83c)}.btn.red{background:linear-gradient(#ff6a69,#c72f3b)}.btn.purple{background:linear-gradient(#c55cff,#7c23d4)}.btn.ghost{background:#071b35;border-color:#3a6e9f}.btn:disabled{opacity:.45;filter:grayscale(.4);cursor:not-allowed}.btnrow{display:flex;gap:.7vw;flex-wrap:wrap;align-items:center}.input,.select,.textarea{width:100%;border:2px solid #4f83b6;border-radius:12px;background:#071b36;color:#fff;padding:.78em .9em;min-height:44px}.textarea{min-height:110px;resize:vertical}.label{display:grid;gap:.45em;font-weight:750}.row{display:flex;align-items:center;justify-content:space-between;gap:1vw;border:2px solid #3e78b0;background:#0a315c;border-radius:14px;padding:1em;margin:.7em 0}.row small{color:#bdd6f3}
/* home */
.home{background:#071a34;position:relative}.campus{position:absolute;inset:0;background-image:linear-gradient(90deg,#06162df4 0 15.4%,transparent 15.4% 87%,#06162dd8 87%),linear-gradient(0deg,#07162df4 0 19%,transparent 19% 90%,#06162def 90%),url('assets/visual/home.png');background-size:cover;background-position:center}.home-side{position:absolute;left:0;top:0;bottom:0;width:15.4%;z-index:4;background:linear-gradient(180deg,#06162df6,#09284ef6);border-right:3px solid #245b91;padding:2vh .9vw}.home-top{position:absolute;left:15.4%;right:0;top:0;height:10%;z-index:4;background:#06162df5;border-bottom:3px solid #1e5388;display:flex;align-items:center;justify-content:flex-end;padding:0 1.2vw;gap:.55vw}.home-right{position:absolute;right:1.2%;top:15%;width:10.2%;z-index:4;display:grid;gap:1.4vh}.quick-card{border:2px solid #08162a;border-radius:14px;background:linear-gradient(#276eb3,#14385f);box-shadow:0 5px 0 #041123;color:#fff;padding:.75em .5em;min-height:74px;font-weight:850;cursor:pointer}.quick-card b{display:block;font-size:1.05em}.quick-card small{color:#d3e8ff}.home-bottom{position:absolute;left:15.4%;right:0;bottom:0;height:19.3%;z-index:4;background:#06162df3;border-top:3px solid #1e5388;display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr 1.15fr;gap:.75vw;padding:1vh 1.2vw}.mode{border:3px solid #061020;border-radius:15px;box-shadow:0 5px 0 #020a15;background:linear-gradient(145deg,#214f82,#102e51);color:#fff;display:flex;align-items:center;gap:.7em;padding:.75em;cursor:pointer;text-align:left}.mode.active{background:linear-gradient(145deg,#38cd61,#177d3c)}.mode .mode-symbol{width:48px;height:48px;border-radius:12px;background:#091d38;border:2px solid #82b6e6;display:grid;place-items:center;font-weight:900}.mode b{font-size:clamp(13px,1.25vw,21px);display:block}.mode small{display:block;color:#d4e9ff}.play-big{border:4px solid #0b1525;border-radius:16px;background:linear-gradient(#ffe65b,#f0a51a);box-shadow:0 7px 0 #875500;color:#14213b;font-weight:900;font-size:clamp(22px,2.4vw,40px);cursor:pointer}.daily-mini{background:linear-gradient(145deg,#1c8dff,#7b2fe0);border-color:#08142a}.hero-info{position:absolute;left:44%;top:68%;transform:translateX(-50%);z-index:3;background:#07162dd9;border:2px solid #6ba8df;border-radius:13px;padding:.7em 1.1em;text-align:center;min-width:200px;box-shadow:var(--shadow)}.hero-info b{display:block;font-size:clamp(18px,1.8vw,30px)}.hero-info span{color:#ffe25b;font-weight:850}
/* brawlers */
.brawler-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,.75fr);gap:1.2vw}.filterbar{display:flex;gap:.65vw;flex-wrap:wrap;margin-bottom:1.2vh}.brawler-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.75vw}.brawler-card{position:relative;border:3px solid #071429;border-radius:15px;min-height:175px;padding:.8vw;cursor:pointer;box-shadow:0 6px 0 #031025;overflow:hidden;color:#fff}.brawler-card.locked{filter:grayscale(.8) brightness(.65)}.brawler-card.selected{outline:4px solid #ffe45a;outline-offset:1px}.brawler-avatar{height:104px;border-radius:13px;background:radial-gradient(circle at 50% 32%,#ffffff55,transparent 22%),linear-gradient(145deg,#29b0ef,#4937ba);display:grid;place-items:center;font-size:clamp(30px,3.1vw,56px);font-weight:900;text-shadow:0 4px #000}.brawler-card b{display:block;font-size:clamp(14px,1.1vw,20px);margin-top:.45em}.brawler-card small{color:#e8f2ff}.r-STARTER{background:linear-gradient(145deg,#1d9a55,#12633b)}.r-SELTEN{background:linear-gradient(145deg,#278c70,#145743)}.r-SUPERSELTEN{background:linear-gradient(145deg,#188bc2,#12648d)}.r-EPISCH{background:linear-gradient(145deg,#ad3b8f,#6d2867)}.r-MYTHISCH{background:linear-gradient(145deg,#d34757,#8b2632)}.r-LEGENDÄR{background:linear-gradient(145deg,#e1a922,#8f6410)}.detail{position:sticky;top:12vh}.detail-avatar{height:260px;border-radius:18px;background:radial-gradient(circle at 50% 28%,#67d4ff,#2778c6 43%,#0a2c58 72%);display:grid;place-items:center;font-size:clamp(72px,8vw,130px);font-weight:900;text-shadow:0 7px #000}.bars{display:grid;gap:.75em;margin:1em 0}.bar{height:15px;border-radius:999px;background:#06152b;border:2px solid #3b6f9d;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#43e867,#ffe24e)}
/* shop */
.offer-grid{display:grid;grid-template-columns:1.25fr 1fr 1fr .8fr;gap:1vw}.offer{position:relative;min-height:420px;border:3px solid #07142b;border-radius:20px;overflow:hidden;box-shadow:0 8px 0 #031026;padding:1vw;display:flex;flex-direction:column;background:linear-gradient(150deg,#e04b2f,#ad241f)}.offer.skin{background:linear-gradient(150deg,#a63fc9,#5d278c)}.offer.brawler{background:linear-gradient(150deg,#1e7ecc,#134c88)}.offer.daily{background:linear-gradient(150deg,#175b9c,#0d345d);min-height:200px}.offer .art{flex:1;display:grid;place-items:center;font-size:clamp(50px,7vw,120px);font-weight:900}.offer h3{font-size:clamp(20px,2vw,35px);margin:.2em 0}.price{font-size:1.15em;font-weight:900;color:#ffe866}.offer .timer{position:absolute;right:10px;top:10px;background:#07162dea;border:1px solid #80b7eb;border-radius:999px;padding:.4em .7em;font-weight:850}.offer-col{display:grid;gap:1vw}
/* drops */
.drop-layout{display:grid;grid-template-columns:1fr 1fr;gap:1.2vw}.drop-panel{min-height:68vh;border:3px solid #07152b;border-radius:22px;background:radial-gradient(circle at 50% 32%,#6d37b866,#142e64 48%,#081b37);box-shadow:var(--shadow);padding:1.1vw;text-align:center;display:flex;flex-direction:column}.drop-panel.mega{background:radial-gradient(circle at 50% 32%,#f8b62255,#144f91 48%,#081b37)}.drop-object{margin:auto;width:min(240px,44%);aspect-ratio:1;border-radius:25%;display:grid;place-items:center;font-size:clamp(70px,9vw,150px);font-weight:900;background:linear-gradient(145deg,#8459ff,#3ab5ff,#ff58d1);box-shadow:0 0 45px #8b65ff,0 16px 30px #0008;transform:rotate(-4deg)}.drop-object.mega{background:linear-gradient(145deg,#ffd64d,#286dd5,#ffb829);box-shadow:0 0 45px #ffc94f,0 16px 30px #0008}.rarity-row{display:flex;justify-content:center;gap:.4vw;flex-wrap:wrap;margin:.8em 0}.rarity-tag{border-radius:9px;padding:.45em .65em;border:2px solid #06152a;font-weight:850;font-size:.83em}.rare{background:#2ab06e}.super{background:#299bd2}.epic{background:#a747c7}.mythic{background:#e15160}.legend{background:#e4b933;color:#15213a}
/* rewards */
.reward-track{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:.8vw;overflow:auto;padding-bottom:1vh}.reward-node{min-height:180px;text-align:center;background:linear-gradient(145deg,#163f70,#0b284d);border:2px solid #4a86c1;border-radius:16px;padding:1em}.reward-node.claimed{opacity:.62}.progress{height:13px;border-radius:999px;background:#051329;border:2px solid #3f78ac;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#35dd60,#ffe14d)}
/* profile */
.profile-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:1.2vw}.profile-avatar{width:180px;max-width:100%;aspect-ratio:1;border-radius:25px;background:linear-gradient(145deg,#20a6e6,#6731bd);display:grid;place-items:center;font-size:72px;font-weight:900;margin:auto}.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.7vw}.stat{background:#061b36;border:2px solid #3f79b2;border-radius:13px;padding:.9em;text-align:center}.stat b{font-size:1.5em;color:#ffe25d;display:block}
/* match */
.match{position:relative;height:100%;background:linear-gradient(160deg,#1c753f,#2b8c4c 48%,#14552f);overflow:hidden}.arena-grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff0c 1px,transparent 1px),linear-gradient(90deg,#ffffff0c 1px,transparent 1px);background-size:6.25% 11.11%}.wall{position:absolute;background:#754d2f;border:3px solid #4b2f1c;border-radius:12px;box-shadow:0 5px 0 #3b2418}.fighter{position:absolute;width:62px;height:62px;border-radius:50%;background:linear-gradient(145deg,#3bc5ff,#4a38d0);border:4px solid #fff;display:grid;place-items:center;font-weight:900;box-shadow:0 6px 12px #0008;transform:translate(-50%,-50%);transition:left .08s linear,top .08s linear}.fighter.bot{background:linear-gradient(145deg,#ff6f63,#c93447);border-color:#ffd4d4}.nameplate{position:absolute;bottom:105%;left:50%;transform:translateX(-50%);white-space:nowrap;background:#041327d9;border-radius:999px;padding:2px 7px;font-size:11px}.health{position:absolute;top:105%;left:0;width:100%;height:7px;border-radius:999px;background:#2e1420;overflow:hidden}.health i{display:block;height:100%;background:#43e65e}.match-hud{position:absolute;top:var(--safe-t);left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:8px;align-items:center;background:#06162de8;border:2px solid #4f86bd;border-radius:14px;padding:7px 10px;box-shadow:var(--shadow)}.match-hud b{font-size:20px}.pause-menu{position:absolute;inset:0;display:none;place-items:center;background:#031025dd;z-index:60}.pause-menu.show{display:grid}.mobile-controls{position:absolute;left:var(--safe-l);right:var(--safe-r);bottom:var(--safe-b);z-index:30;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:4px}.ctrl{pointer-events:auto;border:2px solid #fff8;border-radius:50%;background:#07172db8;color:white;font-weight:900;font-size:22px;backdrop-filter:blur(6px)}.attack-controls{display:flex;gap:10px}.attack{width:72px;height:72px;background:#d94350}.super{width:78px;height:78px;background:#e6b52d;color:#13213b}.dpad .up{grid-column:2}.dpad .left{grid-column:1;grid-row:2}.dpad .right{grid-column:3;grid-row:2}.dpad .down{grid-column:2;grid-row:3}.damage-pop{position:absolute;color:#fff;font-weight:900;text-shadow:0 2px #000;animation:float .65s forwards;pointer-events:none}@keyframes float{to{transform:translateY(-45px);opacity:0}}
/* modal/sidebar */
.overlay{position:absolute;inset:0;z-index:100;display:none;background:#020912bb;backdrop-filter:blur(7px)}.overlay.show{display:block}.drawer{position:absolute;right:0;top:0;bottom:0;width:min(410px,88vw);background:linear-gradient(#09284e,#06162d);border-left:3px solid #4c85bc;padding:calc(var(--safe-t) + 12px) 16px calc(var(--safe-b) + 12px);overflow:auto;box-shadow:-20px 0 50px #0007;animation:drawer .25s ease}@keyframes drawer{from{transform:translateX(100%)}to{transform:none}}.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.drawer h2{margin:0}.drawer-item{width:100%;text-align:left;border:2px solid #4b7fae;border-radius:13px;background:#0c315c;color:#fff;padding:12px;margin:6px 0;cursor:pointer}.drawer-item b{display:block}.drawer-item small{color:#bdd7ef}.x{width:42px;height:42px;border-radius:11px;background:#dc4350;border:2px solid #641821;color:#fff;font-size:24px;cursor:pointer}.modal-wrap{position:absolute;inset:0;z-index:120;display:none;place-items:center;background:#020912c9;backdrop-filter:blur(8px);padding:20px}.modal-wrap.show{display:grid}.modal{width:min(720px,94vw);max-height:88vh;overflow:auto;background:linear-gradient(145deg,#123d70,#071d3b);border:3px solid #5a95cf;border-radius:22px;padding:20px;box-shadow:0 24px 70px #000a}.modal h2{margin-top:0}.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
/* reward reveal */
#reveal{position:absolute;inset:0;z-index:180;display:none;place-items:center;background:radial-gradient(circle at 50% 45%,#284ea9ef,#030a18f5);overflow:hidden}.reveal-show{display:grid!important}.reveal-card{text-align:center;width:min(760px,92vw)}.reveal-object{width:min(250px,42vw);aspect-ratio:1;margin:0 auto 18px;border-radius:25%;background:linear-gradient(145deg,#7759ff,#2cb9ff,#e84fd5);box-shadow:0 0 90px var(--glow,#6aa8ff),0 24px 60px #0009;display:grid;place-items:center;font-size:110px;font-weight:900;animation:shake 1s infinite}.reveal-object.mega{background:linear-gradient(145deg,#ffdb55,#2b72da,#f7a928)}@keyframes shake{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(2deg) scale(1.04)}}.reveal-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:16px 0}.reveal-item{background:#0b2b55;border:2px solid #6a9ccd;border-radius:14px;padding:12px;font-weight:850;animation:pop .35s backwards}@keyframes pop{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:none}}
/* onboarding */
.onboard{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}.onboard-art{min-height:280px;border-radius:20px;background:radial-gradient(circle at 50% 35%,#5ad0ff,#2d73bd 40%,#102b55);display:grid;place-items:center;font-size:110px;font-weight:900}.onboard-steps{display:flex;gap:7px;margin-bottom:12px}.onboard-steps i{height:7px;flex:1;background:#31567c;border-radius:999px}.onboard-steps i.on{background:#ffe04c}
/* editor */
.editor{display:grid;grid-template-columns:1fr 280px;gap:1vw}.map-grid{display:grid;grid-template-columns:repeat(12,1fr);aspect-ratio:12/8;background:#267442;border:3px solid #06162d;border-radius:16px;overflow:hidden}.cell{border:1px solid #ffffff22;background:#2f8b4f;cursor:pointer;min-width:0}.cell.wall{background:#755034}.cell.bush{background:#145f30}.cell.spawnA{background:#2f8eea}.cell.spawnB{background:#e84c58}.cell.gem{background:#9b4ce9}
/* admin */
.admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.admin-pane{display:none}.admin-pane.active{display:block}.audit{max-height:320px;overflow:auto;font-family:ui-monospace,monospace;font-size:12px;background:#041327;border-radius:12px;padding:10px}
/* portrait */
#rotate{position:fixed;inset:0;z-index:1000;display:none;place-items:center;background:linear-gradient(160deg,#06162d,#0f4684);padding:28px;text-align:center}.rotate-card{max-width:420px;background:#0a284e;border:3px solid #5d9bd6;border-radius:24px;padding:26px;box-shadow:var(--shadow)}.rotate-phone{width:100px;height:160px;border:8px solid #fff;border-radius:20px;margin:0 auto 20px;animation:turn 1.8s infinite alternate}@keyframes turn{to{transform:rotate(90deg)}}
#toast{position:absolute;z-index:250;left:50%;bottom:3%;transform:translate(-50%,120px);background:#07162def;border:2px solid #ffe052;border-radius:14px;padding:11px 16px;font-weight:800;box-shadow:var(--shadow);transition:transform .25s;max-width:86vw;text-align:center;pointer-events:none}#toast.show{transform:translate(-50%,0)}

let state=loadState(), current='home', timerHandles=[], match=null, revealQueue=[];
function deepMerge(a,b){if(Array.isArray(a))return Array.isArray(b)?b:a;const o={...a};for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))o[k]=deepMerge(a[k],b[k]);else o[k]=b[k]}return o}
function loadState(){try{return deepMerge(defaultState,JSON.parse(localStorage.getItem(LS)||'{}'))}catch{return structuredClone(defaultState)}}
function save(){localStorage.setItem(LS,JSON.stringify(state));renderHud()}
function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1900)}
function audit(action){const arr=JSON.parse(localStorage.getItem(AUDIT)||'[]');arr.unshift({time:new Date().toLocaleString('de-DE'),user:state.session.user||'lokal',action});localStorage.setItem(AUDIT,JSON.stringify(arr.slice(0,250)))}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function today(){return new Date().toISOString().slice(0,10)}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function navItems(){return [['shop','S','SHOP'],['brawlers','B','BRAWLER'],['skins','K','SKINS'],['pass','P','PASS'],['drops','L','L-DROPS'],['daily','D','TÄGLICH'],['quests','Q','QUESTS'],['rewards','R','BELOHNUNGEN'],['friends','F','FREUNDE'],['club','C','CLUB'],['profile','I','PROFIL'],['settings','E','EINSTELLUNGEN']]}
function renderNav(container,active){container.innerHTML=navItems().map(([id,ic,label])=>`<button data-go="${id}" class="${active===id?'active':''}"><span class="ico">${ic}</span>${label}</button>`).join('')}
function hudHTML(){return `<div class="pill coin"><i></i><b>${state.coins}</b></div><div class="pill gem"><i></i><b>${state.gems}</b></div><div class="pill power"><i></i><b>${state.power}</b></div><div class="pill ticket"><i></i><b>${state.tickets}</b></div>`}
function renderHud(){$('#homeHud').innerHTML=hudHTML();const b=BRAWLERS.find(x=>x.id===state.selected)||BRAWLERS[0];$('#heroName').textContent=b.name;$('#heroPower').textContent='POWER '+(state.levels[b.id]||1);$$('.mode').forEach(x=>x.classList.toggle('active',x.dataset.mode===state.mode))}
function shell(title,body,active){return `<div class="game-shell"><aside class="side"><div class="brand"><div class="logo">LESSING<span>STARS</span></div></div><nav class="nav" data-nav></nav></aside><main class="content"><header class="topbar"><div class="page-title">${title}</div><div class="hud">${hudHTML()}<button class="menu-btn" data-drawer>☰</button></div></header><div class="page">${body}</div></main></div>`}
function clearTimers(){timerHandles.forEach(clearInterval);timerHandles=[]}
function go(id){clearTimers();current=id;location.hash='#/stars/'+id;$('#screen-home').classList.toggle('active',id==='home');$('#screen-generic').classList.toggle('active',id!=='home'&&id!=='match');$('#screen-match').classList.toggle('active',id==='match');if(id==='home'){renderNav($('#homeNav'),'');renderHud();wireCommon($('#screen-home'));return}if(id==='match'){renderMatch();return}renderPage(id)}
function route(){const m=location.hash.match(/^#\/stars\/([\w-]+)/);go(m?.[1]||'home')}
function wireCommon(root=document){$$('[data-go]',root).forEach(b=>b.onclick=()=>go(b.dataset.go));$$('[data-drawer]',root).forEach(b=>b.onclick=openDrawer);$$('[data-mode]',root).forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;state.selectedEvent=b.dataset.mode;save();go('play')})}
function openDrawer(){const items=[['login','Anmelden','Konto verknüpfen und sichern'],['inbox','Post','Nachrichten und Belohnungen'],['events','Events','Modi und Karten'],['resources','Ressourcen','Währungen erklären'],['help','Hilfe & Datenschutz','Anleitungen, Sicherheit und Impressum'],['settings','Einstellungen','Sound, Sprache, Steuerung'],['coach','Zurück zu Lessing Coach','Terminplaner öffnen']];$('#drawerItems').innerHTML=items.map(([id,t,s])=>`<button class="drawer-item" data-drawer-go="${id}"><b>${t}</b><small>${s}</small></button>`).join('')+(state.session.admin?`<button class="drawer-item" data-drawer-go="admin"><b>Admin</b><small>Spiel verwalten</small></button>`:'');$('#drawerOverlay').classList.add('show');$$('[data-drawer-go]').forEach(b=>b.onclick=()=>{closeDrawer();if(b.dataset.drawerGo==='coach')returnCoach();else go(b.dataset.drawerGo)});$('[data-close-drawer]').onclick=closeDrawer}
function closeDrawer(){$('#drawerOverlay').classList.remove('show')}
function returnCoach(){try{window.parent.postMessage({type:'lessing-coach-home'},location.origin)}catch{};try{if(window.parent&&window.parent!==window&&window.parent.closeLessingStars)window.parent.closeLessingStars();else location.href='index.html'}catch{location.href='index.html'}}
function modal(title,body,actions=''){const w=$('#modalWrap'),m=$('#modal');m.innerHTML=`<h2>${title}</h2>${body}<div class="modal-foot">${actions||'<button class="btn" data-close-modal>SCHLIESSEN</button>'}</div>`;w.classList.add('show');$$('[data-close-modal]',m).forEach(b=>b.onclick=()=>w.classList.remove('show'));return m}
function closeModal(){$('#modalWrap').classList.remove('show')}
function renderPage(id){const g=$('#screen-generic');let body='';
 if(id==='brawlers')body=brawlersPage();
 else if(id==='shop')body=shopPage();
 else if(id==='drops')body=dropsPage();
 else if(id==='skins')body=skinsPage();
 else if(id==='pass')body=passPage();
 else if(id==='quests')body=questsPage();
 else if(id==='rewards')body=rewardsPage();
 else if(id==='daily')body=dailyPage();
 else if(id==='events')body=eventsPage();
 else if(id==='friends')body=friendsPage();
 else if(id==='club')body=clubPage();
 else if(id==='profile')body=profilePage();
 else if(id==='settings')body=settingsPage();
 else if(id==='play')body=playPage();

 else if(id==='map-editor')body=state.session.admin?mapEditorPage():loginPage('Admin-Anmeldung erforderlich');
 else {toast('Seite nicht gefunden – Lobby geöffnet');return go('home')}
 g.innerHTML=body;const nav=$('[data-nav]',g);if(nav)renderNav(nav,id);wireCommon(g);wirePage(id,g)}
function allBrawlers(){return [...BRAWLERS,...state.customBrawlers]}
function brawlersPage(){const selected=allBrawlers().find(b=>b.id===state.selected)||allBrawlers()[0];return shell('BRAWLER',`<div class="filterbar"><select class="select" id="bSort" style="width:auto"><option value="rarity">Seltenheit</option><option value="name">Name</option><option value="power">Power</option><option value="trophies">Trophäen</option></select><select class="select" id="bFilter" style="width:auto"><option value="all">Alle</option><option value="owned">Freigeschaltet</option><option value="locked">Gesperrt</option></select><span class="sub">${state.owned.length}/${allBrawlers().length} freigeschaltet</span></div><div class="brawler-layout"><div><div class="brawler-grid" id="bGrid"></div></div><div class="panel detail" id="bDetail">${brawlerDetail(selected)}</div></div>`,'brawlers')}
function brawlerCard(b){const owned=state.owned.includes(b.id),lvl=state.levels[b.id]||1,t=state.trophiesBy[b.id]||0;return `<button class="brawler-card r-${b.rarity} ${owned?'':'locked'} ${state.selected===b.id?'selected':''}" data-brawler="${b.id}"><span class="brawler-avatar">${b.avatar}</span><b>${b.name}</b><small>${b.rarity} · POWER ${lvl} · ${t} Trophäen</small>${owned?'':'<span class="badge">'+b.cost+' C</span>'}</button>`}
function renderBGrid(){const grid=$('#bGrid');if(!grid)return;let arr=[...allBrawlers()],f=$('#bFilter')?.value||'all',s=$('#bSort')?.value||'rarity';if(f==='owned')arr=arr.filter(b=>state.owned.includes(b.id));if(f==='locked')arr=arr.filter(b=>!state.owned.includes(b.id));arr.sort((a,b)=>s==='name'?a.name.localeCompare(b.name):s==='power'?(state.levels[b.id]||1)-(state.levels[a.id]||1):s==='trophies'?(state.trophiesBy[b.id]||0)-(state.trophiesBy[a.id]||0):rarityRank[b.rarity]-rarityRank[a.rarity]);grid.innerHTML=arr.map(brawlerCard).join('');$$('[data-brawler]',grid).forEach(x=>x.onclick=()=>selectBrawler(x.dataset.brawler))}
function brawlerDetail(b){const owned=state.owned.includes(b.id),lvl=state.levels[b.id]||1,upgrade=lvl*250;return `<div class="detail-avatar">${b.avatar}</div><h2>${b.name}</h2><p><b>${b.rarity}</b> · ${b.role}</p><div class="bars"><div>GESUNDHEIT ${b.hp}<div class="bar"><i style="width:${clamp(b.hp/11000*100,10,100)}%"></i></div></div><div>ANGRIFF ${b.attack}<div class="bar"><i style="width:${clamp(b.attack/3200*100,10,100)}%"></i></div></div><div>REICHWEITE ${b.range}/9<div class="bar"><i style="width:${b.range/9*100}%"></i></div></div><div>GESCHWINDIGKEIT ${b.speed}<div class="bar"><i style="width:${b.speed}%"></i></div></div></div><p>SUPER: <b>${b.super}</b></p>${owned?`<div class="btnrow"><button class="btn green" id="selectB">${state.selected===b.id?'AUSGEWÄHLT':'AUSWÄHLEN'}</button><button class="btn gold" id="upgradeB">UPGRADEN · ${upgrade} 🪙 / ${lvl*100} PP</button></div>`:`<button class="btn gold" id="unlockB">FREISCHALTEN · ${b.cost} CREDITS</button>`}`}
function selectBrawler(id){const b=allBrawlers().find(x=>x.id===id);if(!b)return;if(!state.owned.includes(id)){if(state.credits<b.cost)return toast('Nicht genug Credits');state.credits-=b.cost;state.owned.push(id);state.levels[id]=1;state.trophiesBy[id]=0;state.skins[id]=['Klassisch'];state.activeSkin[id]='Klassisch';pushHistory('Brawler freigeschaltet',b.name);save();toast(b.name+' freigeschaltet!')}state.selected=id;save();renderPage('brawlers')}
function shopPage(){const day=Math.floor(Date.now()/86400000),baseOffers=[{title:'STARTER-PAKET',desc:'800 Münzen · 120 Powerpunkte · 1 Mega-Box',cost:79,currency:'gems',kind:'starter'},{title:'NEUER SKIN',desc:'Campus-Nacht für deinen Brawler',cost:69,currency:'gems',kind:'skin'},{title:'BRAWLER-ANGEBOT',desc:'500 Credits für Freischaltungen',cost:99,currency:'gems',kind:'credits'},{title:'MÜNZEN',desc:'750 Münzen',cost:25,currency:'gems',kind:'coins'},{title:'POWERPUNKTE',desc:'300 Powerpunkte',cost:30,currency:'gems',kind:'power'},{title:'L-DROP',desc:'1 L-Drop',cost:180,currency:'coins',kind:'drop'},{title:'MEGA-BOX',desc:'1 Mega-Box',cost:500,currency:'coins',kind:'box'}],offers=[...baseOffers,...state.adminOffers.filter(o=>!o.end||o.end>Date.now())];return shell('SHOP',`<div class="btnrow" style="margin-bottom:1vh"><button class="btn active">ANGEBOTE</button><button class="btn ghost" data-go="skins">SKINS</button><button class="btn ghost" data-go="brawlers">BRAWLER</button><button class="btn ghost" data-go="resources">RESSOURCEN</button></div><div class="offer-grid">${offers.slice(0,3).map((o,i)=>`<div class="offer ${i===1?'skin':i===2?'brawler':''}"><span class="timer">${shopTime()}</span><h3>${o.title}</h3><div class="art">${['★','S','B'][i]}</div><p>${o.desc}</p><button class="btn gold" data-buy="${o.kind}" data-cost="${o.cost}" data-cur="${o.currency}">${o.cost} ${o.currency==='gems'?'JUWELEN':'MÜNZEN'}</button></div>`).join('')}<div class="offer-col">${offers.slice(3).map(o=>`<div class="offer daily"><span class="timer">TÄGLICH</span><h3>${o.title}</h3><p>${o.desc}</p><button class="btn gold" data-buy="${o.kind}" data-cost="${o.cost}" data-cur="${o.currency}">${o.cost} ${o.currency==='gems'?'J':'M'}</button></div>`).join('')}</div></div>`,'shop')}
function shopTime(){const d=new Date(),next=new Date(d);next.setHours(24,0,0,0);const ms=next-d,h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000);return `${h}h ${m}m`}
function buy(kind,cost,cur){if(state[cur]<cost)return toast('Nicht genug '+(cur==='gems'?'Juwelen':'Münzen'));state[cur]-=cost;if(kind==='starter'){state.coins+=800;state.power+=120;state.boxes++}if(kind==='skin'){const id=state.selected;state.skins[id]??=['Klassisch'];if(!state.skins[id].includes('Campus-Nacht'))state.skins[id].push('Campus-Nacht');else state.coins+=200}if(kind==='credits')state.credits+=500;if(kind==='coins')state.coins+=750;if(kind==='power')state.power+=300;if(kind==='drop')state.drops++;if(kind==='box')state.boxes++;pushHistory('Shop-Kauf',kind);save();toast('Kauf erfolgreich');renderPage('shop')}
function dropsPage(){return shell('L-DROPS & MEGA-BOXEN',`<div class="drop-layout"><section class="drop-panel"><h2>L-DROP</h2><p class="sub">${state.drops} vorhanden · Legendary: 1–3 Belohnungen</p><div class="drop-object">L</div><div class="rarity-row"><span class="rarity-tag rare">SELTEN</span><span class="rarity-tag super">SUPERSELTEN</span><span class="rarity-tag epic">EPISCH</span><span class="rarity-tag mythic">MYTHISCH</span><span class="rarity-tag legend">LEGENDÄR</span></div><div class="btnrow" style="justify-content:center"><button class="btn green" data-open="drop" data-count="1">1× ÖFFNEN</button><button class="btn green" data-open="drop" data-count="3">3× ÖFFNEN</button></div></section><section class="drop-panel mega"><h2>MEGA BOX</h2><p class="sub">${state.boxes} vorhanden · 4–8 Belohnungen pro Box</p><div class="drop-object mega">M</div><div class="rarity-row"><span class="rarity-tag legend">MEHRERE REWARDS</span></div><div class="btnrow" style="justify-content:center"><button class="btn green" data-open="box" data-count="1">1×</button><button class="btn green" data-open="box" data-count="3">3×</button><button class="btn green" data-open="box" data-count="5">5×</button><button class="btn green" data-open="box" data-count="10">10×</button></div></section></div>`,'drops')}
function rollRarity(){const r=Math.random();return r<.50?'SELTEN':r<.78?'SUPERSELTEN':r<.93?'EPISCH':r<.985?'MYTHISCH':'LEGENDÄR'}
function rewardFor(rarity,mega=false){const idx=rarityRank[rarity]||1,types=['coins','power','credits','gems'];const count=mega?rand(4,8):(rarity==='LEGENDÄR'?rand(1,3):rand(1,Math.min(3,1+Math.floor(idx/2))));const out=[];for(let i=0;i<count;i++){const t=types[rand(0,types.length-1)];if(t==='coins')out.push({type:t,value:mega?rand(180,420):rand(40,90)+idx*15});if(t==='power')out.push({type:t,value:mega?rand(70,160):rand(10,35)+idx*10});if(t==='credits')out.push({type:t,value:mega?rand(80,220):rand(25,70)+idx*15});if(t==='gems')out.push({type:t,value:mega?rand(3,10):(idx>=4?rand(1,5):1)})}if((mega&&Math.random()<.28)||(rarity==='LEGENDÄR'&&Math.random()<.45)){const locked=allBrawlers().filter(b=>!state.owned.includes(b.id));if(locked.length)out.push({type:'brawler',value:locked[rand(0,locked.length-1)].id})}if(Math.random()<(mega?.18:.06)){const possible=SKINS.filter(s=>!(state.skins[state.selected]||[]).includes(s));if(possible.length)out.push({type:'skin',value:possible[rand(0,possible.length-1)]})}return out}
function openRewards(kind,count){const key=kind==='drop'?'drops':'boxes';if(state[key]<count)return toast('Nicht genug '+(kind==='drop'?'L-Drops':'Mega-Boxen'));state[key]-=count;const batches=[];for(let i=0;i<count;i++){const rarity=kind==='drop'?rollRarity():'MEGA',items=rewardFor(rarity,kind==='box');batches.push({rarity,items});items.forEach(applyReward)}save();pushHistory(kind==='drop'?'L-Drop geöffnet':'Mega-Box geöffnet',`${count}×`);showReveal(kind,batches)}
function applyReward(r){if(r.type==='coins')state.coins+=r.value;if(r.type==='power')state.power+=r.value;if(r.type==='credits')state.credits+=r.value;if(r.type==='gems')state.gems+=r.value;if(r.type==='brawler'){if(state.owned.includes(r.value)){state.credits+=120;r.type='credits';r.value=120}else{state.owned.push(r.value);state.levels[r.value]=1;state.trophiesBy[r.value]=0;state.skins[r.value]=['Klassisch'];state.activeSkin[r.value]='Klassisch'}}if(r.type==='skin'){const id=state.selected;state.skins[id]??=['Klassisch'];if(state.skins[id].includes(r.value)){state.coins+=150;r.type='coins';r.value=150}else state.skins[id].push(r.value)}}
function showReveal(kind,batches){const r=$('#reveal');revealQueue=batches;let bi=0;const step=()=>{const b=batches[bi],isMega=kind==='box';r.innerHTML=`<div class="reveal-card"><h1>${isMega?'MEGA-BOX':b.rarity}</h1><div class="reveal-object ${isMega?'mega':''}" style="--glow:${rarityColors[b.rarity]||'#ffc63d'}">${isMega?'M':'L'}</div><div class="reveal-list">${b.items.map((x,i)=>`<div class="reveal-item" style="animation-delay:${i*.12}s">${rewardLabel(x)}</div>`).join('')}</div><button class="btn gold" id="revealNext">${bi<batches.length-1?'NÄCHSTE ÖFFNUNG':'FERTIG'}</button></div>`;r.classList.add('reveal-show');$('#revealNext').onclick=()=>{bi++;if(bi<batches.length)step();else{r.classList.remove('reveal-show');renderPage('drops')}}};step()}
function rewardLabel(r){if(r.type==='brawler')return 'NEUER BRAWLER<br><b>'+allBrawlers().find(b=>b.id===r.value)?.name+'</b>';if(r.type==='skin')return 'NEUER SKIN<br><b>'+r.value+'</b>';return ({coins:'MÜNZEN',power:'POWERPUNKTE',credits:'CREDITS',gems:'JUWELEN'}[r.type]||r.type)+'<br><b>+'+r.value+'</b>'}
function skinsPage(){const id=state.selected,owned=state.skins[id]||['Klassisch'],active=state.activeSkin[id]||'Klassisch';return shell('SKINS',`<p class="sub">Skins für ${allBrawlers().find(b=>b.id===id)?.name}</p><div class="grid">${SKINS.map((s,i)=>{const has=owned.includes(s),cost=s==='Champion'?149:s==='Lessing-Hero'?119:50;return `<div class="panel"><div class="brawler-avatar" style="height:140px">${s.slice(0,2).toUpperCase()}</div><h3>${s}</h3><p>${active===s?'Ausgewählt':has?'Im Besitz':cost+' Juwelen'}</p><button class="btn ${active===s?'ghost':has?'green':'purple'}" data-skin="${s}" data-cost="${cost}">${active===s?'AUSGEWÄHLT':has?'AUSWÄHLEN':'KAUFEN'}</button></div>`}).join('')}</div>`,'skins')}
function passPage(){const lvl=Math.floor(state.passXP/100)+1;return shell('LESSING PASS',`<div class="panel"><div class="row"><span>PASS-STUFE <b>${lvl}</b></span><span>${state.passXP%100}/100 XP</span></div><div class="progress"><i style="width:${state.passXP%100}%"></i></div></div><h2 class="section-title" style="margin-top:1.6vh">Belohnungspfad</h2><div class="reward-track">${Array.from({length:20},(_,i)=>{const n=i+1,claimed=state.claimedPass.includes(n),need=(n-1)*100,open=state.passXP>=need;return `<div class="reward-node ${claimed?'claimed':''}"><b>STUFE ${n}</b><div style="font-size:42px;margin:14px">${i%4===0?'L':i%4===1?'M':i%4===2?'C':'P'}</div><p>${i%4===0?'L-Drop':i%4===1?'Mega-Box':i%4===2?'150 Credits':'100 Powerpunkte'}</p><button class="btn gold" data-pass="${n}" ${!open||claimed?'disabled':''}>${claimed?'ABGEHOLT':open?'ABHOLEN':'GESPERRT'}</button></div>`}).join('')}</div>`,'pass')}
function questsPage(){const base=[['matches','3 Matches spielen',state.quests.matches,3,'200 Münzen'],['wins','1 Match gewinnen',state.quests.wins,1,'50 Powerpunkte'],['kos','5 Gegner besiegen',state.quests.kos,5,'1 L-Drop'],['damage','2500 Schaden verursachen',state.quests.damage,2500,'100 Credits']],all=[...base,...state.adminQuests.map((q,i)=>['a'+i,q.title,state.quests['a'+i]||0,q.target,q.reward])];return shell('QUESTS',`<div class="grid">${all.map(q=>`<div class="panel"><h3>${q[1]}</h3><p>${q[2]} / ${q[3]}</p><div class="progress"><i style="width:${clamp(q[2]/q[3]*100,0,100)}%"></i></div><br><button class="btn green" data-quest="${q[0]}" data-target="${q[3]}" ${state.claimedQuests.includes(q[0])?'disabled':''}>${state.claimedQuests.includes(q[0])?'ABGEHOLT':q[4]}</button></div>`).join('')}</div><h2 class="section-title" style="margin-top:2vh">Trophäenpfad</h2><div class="reward-track">${[25,50,75,100,150,200,300,400,500,650,800,1000].map(x=>`<div class="reward-node ${state.claimedPath.includes(x)?'claimed':''}"><b>${x} TROPHÄEN</b><div style="font-size:40px;margin:14px">★</div><p>200 Münzen</p><button class="btn gold" data-path="${x}" ${state.trophies<x||state.claimedPath.includes(x)?'disabled':''}>${state.claimedPath.includes(x)?'ABGEHOLT':'ABHOLEN'}</button></div>`).join('')}</div>`,'quests')}
function rewardsPage(){return shell('BELOHNUNGEN',`<div class="grid"><div class="panel"><h3>Letzte Belohnungen</h3><div class="list">${state.history.slice(0,12).map(h=>`<div class="row"><span><b>${h.title}</b><br><small>${h.detail}</small></span><small>${h.time}</small></div>`).join('')||'<p>Noch keine Belohnungen gesammelt.</p>'}</div></div><div class="panel"><h3>Sammlung</h3><p>Brawler: <b>${state.owned.length}/${allBrawlers().length}</b></p><p>L-Drops: <b>${state.drops}</b></p><p>Mega-Boxen: <b>${state.boxes}</b></p><p>Skins: <b>${Object.values(state.skins).flat().length}</b></p><div class="btnrow"><button class="btn" data-go="drops">DROPS</button><button class="btn" data-go="pass">PASS</button></div></div><div class="panel"><h3>Postfach</h3><p>${state.inbox.filter(x=>!x.claimed).length} offene Nachrichten.</p><button class="btn gold" data-go="inbox">POST ÖFFNEN</button></div></div>`,'rewards')}
function dailyPage(){const claimed=state.lastDaily===today(),day=(state.dailyStreak%7)+1;return shell('TÄGLICHE BELOHNUNG',`<div class="panel" style="max-width:900px;margin:auto;text-align:center"><h2>TAG ${day} VON 7</h2><p class="sub">Komm jeden Tag zurück und baue deine Serie aus.</p><div class="reward-track">${Array.from({length:7},(_,i)=>`<div class="reward-node ${i<day-1?'claimed':''}"><b>TAG ${i+1}</b><div style="font-size:42px;margin:15px">${i===6?'M':i%2?'P':'C'}</div><p>${i===6?'1 Mega-Box':i%2?'80 Powerpunkte':'250 Münzen'}</p></div>`).join('')}</div><br><button class="btn gold" id="claimDaily" ${claimed?'disabled':''}>${claimed?'HEUTE ABGEHOLT':'HEUTE ABHOLEN'}</button></div>`,'daily')}
function eventsPage(){const ev=[...MODES,...state.adminEvents].map((e,i)=>({id:e.id||e.name||('event'+i),map:e.map||'Custom Map',team:e.team??false,end:e.end||Date.now()+86400000*(i+1)}));return shell('EVENTS',`<div class="grid">${ev.map(e=>`<div class="panel"><h3>${e.id}</h3><p>${e.map} · ${e.team?'Team':'Solo'}</p><p class="sub" data-event-time="${e.end}"></p><button class="btn gold" data-event="${e.id}">AUSWÄHLEN & SPIELEN</button></div>`).join('')}</div>`,'events')}
function friendsPage(){return shell('FREUNDE',`<div class="grid"><div class="panel"><h3>Freund hinzufügen</h3><label class="label">Freund-Code<input class="input" id="friendCode" placeholder="z. B. LST-1234"></label><br><button class="btn green" id="addFriend">ANFRAGE SENDEN</button><p class="sub">Dein Code: <b>${friendCode()}</b></p></div><div class="panel"><h3>Anfragen</h3><div id="requests">${state.friendRequests.map((f,i)=>`<div class="row"><span>${f}</span><span class="btnrow"><button class="btn green" data-accept="${i}">ANNEHMEN</button><button class="btn red" data-decline="${i}">ABLEHNEN</button></span></div>`).join('')||'<p>Keine offenen Anfragen.</p>'}</div></div><div class="panel"><h3>Freundesliste</h3>${state.friends.map((f,i)=>`<div class="row"><span><b>${f}</b><br><small>online</small></span><span class="btnrow"><button class="btn" data-invite="${f}">EINLADEN</button><button class="btn red" data-remove-friend="${i}">×</button></span></div>`).join('')||'<p>Noch keine Freunde.</p>'}</div></div>`,'friends')}
function friendCode(){return 'LST-'+btoa(state.name).replace(/[^A-Z0-9]/gi,'').slice(0,4).toUpperCase().padEnd(4,'0')}
function clubPage(){if(!state.club)return shell('CLUB',`<div class="grid"><div class="panel"><h3>Club erstellen</h3><label class="label">Clubname<input class="input" id="clubName" maxlength="30" placeholder="Clubname"></label><label class="label">Beschreibung<textarea class="textarea" id="clubDesc" placeholder="Beschreibung"></textarea></label><br><button class="btn green" id="createClub">CLUB ERSTELLEN</button></div><div class="panel"><h3>Club beitreten</h3><label class="label">Club-Code<input class="input" id="clubCode" placeholder="z. B. LC1234"></label><br><button class="btn gold" id="joinClub">BEITRETEN</button></div></div>`,'club');return shell('CLUB',`<div class="panel"><div class="row"><span><h2 style="margin:0">${state.club.name}</h2><small>${state.club.code}</small></span><button class="btn red" id="leaveClub">VERLASSEN</button></div><p>${state.club.desc||'Gemeinsam spielen und Belohnungen sammeln.'}</p><div class="stats-grid"><div class="stat"><b>${state.club.members.length}/30</b>Mitglieder</div><div class="stat"><b>${state.club.points}</b>Club-Punkte</div><div class="stat"><b>${state.club.rank}</b>Rang</div></div><h3>Mitglieder</h3>${state.club.members.map((m,i)=>`<div class="row"><span><b>${m.name}</b><br><small>${m.role}</small></span>${i?'<button class="btn" data-promote="'+i+'">ROLLE</button>':''}</div>`).join('')}</div>`,'club')}
function profilePage(){return shell('PROFIL',`<div class="profile-grid"><div class="panel" style="text-align:center"><div class="profile-avatar" id="profileAvatar" style="background:${state.profileColor}">${state.icon}</div><h2>${state.name}</h2><p class="sub">${friendCode()}</p><div class="btnrow" style="justify-content:center"><button class="btn" id="editProfile">PROFIL BEARBEITEN</button>${state.session.loggedIn?'<button class="btn red" id="logout">ABMELDEN</button>':'<button class="btn gold" data-go="login">ANMELDEN</button>'}</div></div><div class="panel"><div class="stats-grid"><div class="stat"><b>${state.trophies}</b>Trophäen</div><div class="stat"><b>${state.stats.wins}</b>Siege</div><div class="stat"><b>${state.stats.matches}</b>Matches</div><div class="stat"><b>${state.stats.kos}</b>KOs</div><div class="stat"><b>${state.stats.bestTrophies}</b>Bestwert</div><div class="stat"><b>${state.owned.length}</b>Brawler</div></div><h3>Lieblings-Brawler</h3><p>${allBrawlers().find(b=>b.id===state.selected)?.name}</p></div></div>`,'profile')}
function settingsPage(){return shell('EINSTELLUNGEN',`<div class="grid"><div class="panel"><h3>Audio & Animation</h3>${[['music','Musik'],['sfx','Soundeffekte'],['animations','Animationen'],['reducedMotion','Reduzierte Bewegung']].map(([k,l])=>`<label class="row"><span>${l}</span><input type="checkbox" data-setting="${k}" ${state.settings[k]?'checked':''}></label>`).join('')}</div><div class="panel"><h3>Sprache & Steuerung</h3><div class="row"><span>Sprache</span><select class="select" style="width:auto" id="language"><option value="de">Deutsch</option><option value="en" disabled>English (später)</option></select></div><div class="row"><span>Desktop</span><small>WASD / Pfeile · Leertaste Angriff · E Super · P Pause</small></div><div class="row"><span>Mobil</span><small>Virtuelle Steuerung im Match</small></div></div><div class="panel"><h3>Konto & Daten</h3><div class="btnrow"><button class="btn gold" data-go="login">KONTO</button><button class="btn" data-go="help">DATENSCHUTZ</button><button class="btn red" id="resetGame">SPIELSTAND ZURÜCKSETZEN</button></div><br><button class="btn ghost" id="coachReturn">ZURÜCK ZUM TERMINPLANER</button><p class="sub">Lessing Stars v${VERSION}</p></div></div>`,'settings')}
function playPage(){const b=allBrawlers().find(x=>x.id===state.selected);return shell('SPIELEN',`<div class="grid" style="grid-template-columns:1fr 1.2fr 1fr"><div class="panel"><h3>MODUS</h3>${MODES.map(m=>`<button class="row" data-play-mode="${m.id}" style="width:100%;color:#fff;cursor:pointer"><span><b>${m.id}</b><br><small>${m.map}</small></span><b>${state.mode===m.id?'✓':''}</b></button>`).join('')}</div><div class="panel" style="text-align:center"><div class="detail-avatar" style="height:250px">${b.avatar}</div><h2>${b.name}</h2><p>${state.activeSkin[b.id]||'Klassisch'} · POWER ${state.levels[b.id]||1}</p><button class="btn" data-go="brawlers">BRAWLER WECHSELN</button></div><div class="panel"><h3>MATCH</h3><button class="btn gold" style="width:100%;font-size:1.5em;padding:1.1em" id="quickPlay">SCHNELLSPIEL</button><br><br><button class="btn green" style="width:100%" id="training">TRAINING</button><hr style="border-color:#ffffff22;margin:20px 0"><h3>PRIVATER RAUM</h3><input class="input" id="roomCode" placeholder="Raum-Code"><div class="btnrow" style="margin-top:10px"><button class="btn" id="joinRoom">BEITRETEN</button><button class="btn purple" id="createRoom">ERSTELLEN</button></div><p class="sub">Freunde können über den Raumcode beitreten.</p></div></div>`,'')}
function loginPage(note=''){return shell('ANMELDUNG',`<div class="panel" style="max-width:720px;margin:auto"><h2>${note||'Melde dich bei Lessing Stars an'}</h2><p class="sub">Neue Konten werden lokal in diesem Build gespeichert. Für eine öffentliche Website muss die vorhandene Server-/Datenbank-Anbindung verwendet werden.</p><label class="label">Benutzername<input class="input" id="loginUser" autocomplete="username"></label><label class="label">Passwort<input class="input" id="loginPass" type="password" autocomplete="current-password"></label><br><div class="btnrow"><button class="btn green" id="doLogin">ANMELDEN</button><button class="btn" id="guestLogin">GAST SPIELEN</button><button class="btn purple" id="register">NEUES KONTO</button><button class="btn ghost" id="forgot">PASSWORT VERGESSEN?</button>${state.session.loggedIn?'<button class="btn" id="changePass">PASSWORT ÄNDERN</button><button class="btn red" id="deleteAccount">KONTO LÖSCHEN</button>':''}</div></div>`,'')}
function inboxPage(){return shell('POST',`<div class="list">${state.inbox.map((m,i)=>`<div class="row"><span><b>${m.title}</b><br><small>${m.body}</small></span>${m.reward&&!m.claimed?`<button class="btn gold" data-mail="${i}">ABHOLEN</button>`:'<small>'+ (m.claimed?'Abgeholt':'Gelesen') +'</small>'}</div>`).join('')||'<p>Postfach leer.</p>'}</div>`,'')}
function resourcesPage(){return shell('RESSOURCEN',`<div class="grid"><div class="panel"><h3>MÜNZEN · ${state.coins}</h3><p>Für Brawler-Upgrades und bestimmte Shop-Angebote.</p></div><div class="panel"><h3>JUWELEN · ${state.gems}</h3><p>Für Skins, Sonderangebote und kosmetische Inhalte.</p></div><div class="panel"><h3>POWERPUNKTE · ${state.power}</h3><p>Zusammen mit Münzen zum Verbessern von Brawlern.</p></div><div class="panel"><h3>CREDITS · ${state.credits}</h3><p>Zum Freischalten neuer Brawler.</p></div><div class="panel"><h3>L-DROPS · ${state.drops}</h3><p>Zufällige Belohnungen mit Seltenheiten.</p><button class="btn" data-go="drops">ÖFFNEN</button></div><div class="panel"><h3>MEGA-BOXEN · ${state.boxes}</h3><p>Enthalten mehrere Belohnungen pro Öffnung.</p><button class="btn" data-go="drops">ÖFFNEN</button></div></div>`,'')}

function upgradeBrawler(id){const lvl=state.levels[id]||1,cost=lvl*250,pp=lvl*100;if(lvl>=11)return toast('Maximales Power-Level');if(state.coins<cost||state.power<pp)return toast('Nicht genug Münzen oder Powerpunkte');state.coins-=cost;state.power-=pp;state.levels[id]=lvl+1;save();pushHistory('Brawler verbessert',allBrawlers().find(b=>b.id===id).name+' auf Power '+(lvl+1));renderPage('brawlers')}
function buySkin(name,cost){const id=state.selected,stateOwned=state.skins[id]??=['Klassisch'];if(stateOwned.includes(name)){state.activeSkin[id]=name;save();return renderPage('skins')}if(state.gems<cost)return toast('Nicht genug Juwelen');state.gems-=cost;stateOwned.push(name);state.activeSkin[id]=name;save();pushHistory('Skin gekauft',name);renderPage('skins')}
function claimPass(n){if(state.claimedPass.includes(n))return;const need=(n-1)*100;if(state.passXP<need)return toast('Stufe noch nicht erreicht');state.claimedPass.push(n);const type=(n-1)%4;if(type===0)state.drops++;if(type===1)state.boxes++;if(type===2)state.credits+=150;if(type===3)state.power+=100;pushHistory('Pass-Belohnung','Stufe '+n);save();renderPage('pass')}
function claimQuest(k,target){if(state.claimedQuests.includes(k))return;const v=state.quests[k]||0;if(v<target)return toast('Quest noch nicht abgeschlossen');state.claimedQuests.push(k);if(k==='matches')state.coins+=200;else if(k==='wins')state.power+=50;else if(k==='kos')state.drops++;else if(k==='damage')state.credits+=100;else state.coins+=200;pushHistory('Quest abgeschlossen',k);save();renderPage('quests')}
function claimPath(x){if(state.trophies<x||state.claimedPath.includes(x))return;state.claimedPath.push(x);state.coins+=200;pushHistory('Trophäenpfad',x+' Trophäen');save();renderPage('quests')}
function claimDaily(){if(state.lastDaily===today())return;state.lastDaily=today();state.dailyStreak=(state.dailyStreak%7)+1;if(state.dailyStreak===7)state.boxes++;else if(state.dailyStreak%2)state.coins+=250;else state.power+=80;pushHistory('Tägliche Belohnung','Tag '+state.dailyStreak);save();renderPage('daily')}
function wireFriends(){$('#addFriend').onclick=()=>{const c=$('#friendCode').value.trim().toUpperCase();if(!c)return toast('Bitte Freund-Code eingeben');if(state.friends.includes(c))return toast('Bereits befreundet');state.friendRequests.push(c);save();toast('Freundesanfrage gesendet');renderPage('friends')};$$('[data-accept]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.accept),f=state.friendRequests[i];state.friendRequests.splice(i,1);if(!state.friends.includes(f))state.friends.push(f);save();renderPage('friends')});$$('[data-decline]').forEach(b=>b.onclick=()=>{state.friendRequests.splice(Number(b.dataset.decline),1);save();renderPage('friends')});$$('[data-remove-friend]').forEach(b=>b.onclick=()=>{state.friends.splice(Number(b.dataset.removeFriend),1);save();renderPage('friends')});$$('[data-invite]').forEach(b=>b.onclick=()=>toast('Einladung an '+b.dataset.invite+' gesendet'))}

async function hashPass(s){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function getUsers(){try{return JSON.parse(localStorage.getItem(USERS)||'{}')}catch{return {}}}function setUsers(u){localStorage.setItem(USERS,JSON.stringify(u))}
function wireLogin(){const user=$('#loginUser'),pass=$('#loginPass');$('#guestLogin').onclick=()=>{state.session={loggedIn:false,user:'Gast',admin:false};save();go('home')};$('#register').onclick=async()=>{const u=user.value.trim(),p=pass.value;if(u.length<3||p.length<4)return toast('Name mindestens 3, Passwort mindestens 4 Zeichen');const users=getUsers();if(users[u])return toast('Benutzer existiert bereits');users[u]={hash:await hashPass(p),created:Date.now()};setUsers(users);state.session={loggedIn:true,user:u,admin:false};state.name=u;save();toast('Konto erstellt');go('home')};$('#doLogin').onclick=async()=>{const u=user.value.trim(),p=pass.value;if(u==='Lessing'&&p==='Schulen'){state.session={loggedIn:true,user:'Lessing',admin:true};save();audit('Admin angemeldet');toast('Admin angemeldet');return go('home')}const users=getUsers();if(!users[u]||users[u].hash!==await hashPass(p))return toast('Benutzername oder Passwort falsch');if(state.bannedPlayers.includes(u))return toast('Konto ist gesperrt');state.session={loggedIn:true,user:u,admin:false};state.name=u;save();go('home')};$('#forgot').onclick=()=>modal('Passwort vergessen','<p>Im lokalen Demo-Build gibt es keinen E-Mail-Versand. Ein Admin kann das Konto zurücksetzen. Im produktiven Betrieb muss die Server-Anbindung genutzt werden.</p>');$('#changePass')?.addEventListener('click',()=>{const m=modal('Passwort ändern','<label class="label">Neues Passwort<input class="input" id="newPass" type="password"></label>', '<button class="btn" data-close-modal>ABBRECHEN</button><button class="btn green" id="savePass">SPEICHERN</button>');$('[data-close-modal]',m).onclick=closeModal;$('#savePass').onclick=async()=>{const p=$('#newPass').value;if(p.length<4)return toast('Mindestens 4 Zeichen');const users=getUsers(),u=state.session.user;if(users[u]){users[u].hash=await hashPass(p);setUsers(users);closeModal();toast('Passwort geändert')}}});$('#deleteAccount')?.addEventListener('click',()=>{const m=modal('Konto löschen','<p>Lokales Konto wirklich löschen?</p>','<button class="btn" data-close-modal>ABBRECHEN</button><button class="btn red" id="confirmDelete">LÖSCHEN</button>');$('[data-close-modal]',m).onclick=closeModal;$('#confirmDelete').onclick=()=>{const users=getUsers(),u=state.session.user;delete users[u];setUsers(users);state.session={loggedIn:false,user:'',admin:false};save();closeModal();go('home')}})}

function diagnostics(){const issues=[];if(!state.owned.includes('hamza'))issues.push('Hamza.S. fehlt');if(!allBrawlers().find(b=>b.id==='safa'))issues.push('Safa Yildiz fehlt');if(!localStorage)issues.push('localStorage nicht verfügbar');modal('Diagnose',`<p>Version: ${VERSION}</p><p>Brawler: ${allBrawlers().length}</p><p>Speicher: ${JSON.stringify(state).length} Zeichen</p><p>${issues.length?'Probleme: '+issues.join(', '):'Keine offensichtlichen lokalen Zustandsfehler gefunden.'}</p>`) }

function startMatch(training=false,map=null){match={training,map,paused:false,started:false,time:45,health:100,super:0,x:50,y:70,kos:0,damage:0,timer:null,lastInput:Date.now(),spectating:false};sessionStorage.setItem('LESSING_STARS_MATCH',JSON.stringify({training,mode:state.mode,startedAt:Date.now()}));go('match')}
function renderMatch(){const s=$('#screen-match');s.innerHTML=`<div class="match"><div class="arena-grid"></div>${['10,18,18,8','52,24,20,8','28,52,14,8','66,60,18,8'].map(v=>{const [l,t,w,h]=v.split(',');return `<div class="wall" style="left:${l}%;top:${t}%;width:${w}%;height:${h}%"></div>`}).join('')}<div class="match-hud"><button class="btn" id="pause">Ⅱ</button><b id="matchMode">${state.mode}</b><span id="matchTimer">00:45</span><span>SUPER <b id="superPct">0%</b></span></div><div class="fighter" id="player"><span class="nameplate">${escapeHtml(state.name)}</span><span>${allBrawlers().find(b=>b.id===state.selected)?.avatar}</span><span class="health"><i id="healthBar" style="width:100%"></i></span></div>${Array.from({length:5},(_,i)=>`<div class="fighter bot" data-bot="${i}" style="left:${15+i*16}%;top:${25+(i%2)*25}%"><span class="nameplate">Bot ${i+1}</span><span>B${i+1}</span><span class="health"><i></i></span></div>`).join('')}<div class="mobile-controls"><div class="dpad"><button class="ctrl up" data-move="0,-1">↑</button><button class="ctrl left" data-move="-1,0">←</button><button class="ctrl right" data-move="1,0">→</button><button class="ctrl down" data-move="0,1">↓</button></div><div class="attack-controls"><button class="ctrl attack" id="attack">ANG</button><button class="ctrl super" id="superBtn">SUPER</button></div></div><div class="pause-menu" id="pauseMenu"><div class="modal"><h2>PAUSE</h2><div class="btnrow"><button class="btn green" id="resume">WEITER</button><button class="btn red" id="leaveMatch">MATCH VERLASSEN</button></div></div></div><div id="countdown" style="position:absolute;inset:0;display:grid;place-items:center;font-size:16vw;font-weight:900;text-shadow:0 10px #000;z-index:50"></div></div>`;positionPlayer();$('#pause').onclick=togglePause;$('#resume').onclick=togglePause;$('#leaveMatch').onclick=()=>endMatch(false,true);$('#attack').onclick=attack;$('#superBtn').onclick=useSuper;$$('[data-move]').forEach(b=>{const [dx,dy]=b.dataset.move.split(',').map(Number);b.onpointerdown=()=>movePlayer(dx,dy)});let n=3;$('#countdown').textContent=n;const cd=setInterval(()=>{n--;if(n>0)$('#countdown').textContent=n;else if(n===0)$('#countdown').textContent='LOS!';else{clearInterval(cd);$('#countdown').remove();match.started=true;match.timer=setInterval(matchTick,1000)}},650);timerHandles.push(cd);document.onkeydown=matchKey}
function matchKey(e){if(current!=='match')return;const k=e.key.toLowerCase();if(k==='p')togglePause();if(k===' '){e.preventDefault();attack()}if(k==='e')useSuper();if(['w','arrowup'].includes(k))movePlayer(0,-1);if(['s','arrowdown'].includes(k))movePlayer(0,1);if(['a','arrowleft'].includes(k))movePlayer(-1,0);if(['d','arrowright'].includes(k))movePlayer(1,0)}
function positionPlayer(){const p=$('#player');if(p){p.style.left=match.x+'%';p.style.top=match.y+'%';$('#healthBar').style.width=match.health+'%';$('#superPct').textContent=Math.round(match.super)+'%'}}
function movePlayer(dx,dy){if(!match?.started||match.paused||match.spectating)return;match.lastInput=Date.now();match.x=clamp(match.x+dx*3,4,96);match.y=clamp(match.y+dy*4,8,92);positionPlayer()}
function attack(){if(!match?.started||match.paused||match.spectating)return;match.lastInput=Date.now();const bots=$$('[data-bot]');if(!bots.length)return;const bot=bots[rand(0,bots.length-1)],rect=bot.getBoundingClientRect(),arena=$('#screen-match').getBoundingClientRect(),dmg=rand(350,850);const pop=document.createElement('div');pop.className='damage-pop';pop.textContent='-'+dmg;pop.style.left=(rect.left-arena.left+20)+'px';pop.style.top=(rect.top-arena.top)+'px';$('.match').append(pop);setTimeout(()=>pop.remove(),700);match.damage+=dmg;match.super=clamp(match.super+dmg/35,0,100);if(Math.random()<.22){match.kos++;bot.style.opacity='.25';setTimeout(()=>bot.style.opacity='1',1500)}positionPlayer()}
function useSuper(){if(match?.spectating)return;if(match.super<100)return toast('Super noch nicht geladen');match.lastInput=Date.now();match.super=0;match.damage+=1200;match.kos+=Math.random()<.5?1:0;$('.match').animate?.([{filter:'brightness(1)'},{filter:'brightness(1.8)'},{filter:'brightness(1)'}],{duration:350});positionPlayer()}
function matchTick(){if(match.paused||!match.started)return;match.time--;$('#matchTimer').textContent='00:'+String(match.time).padStart(2,'0');if(Date.now()-match.lastInput>15000&&!match.spectating){toast('AFK erkannt – bewege dich, um weiterzuspielen');match.lastInput=Date.now()}if(Math.random()<.18&&!match.spectating){match.health=clamp(match.health-rand(4,13),0,100);if(match.health<=0){if(state.mode==='Showdown'&&!match.training){match.spectating=true;$('#player').style.display='none';const m=modal('AUSGESCHIEDEN','<p>Du kannst den Rest des Matches anschauen oder zur Lobby zurückgehen.</p>','<button class="btn green" id="spectate">ZUSCHAUEN</button><button class="btn red" id="spectateLeave">LOBBY</button>');$('#spectate').onclick=()=>{closeModal();toast('Zuschauermodus')};$('#spectateLeave').onclick=()=>{closeModal();endMatch(false,true)}}else{match.health=100;toast('Respawn in 2 Sekunden');match.x=50;match.y=70}}positionPlayer()}if(match.time<=0)endMatch(Math.random()>.42)}
function togglePause(){if(!match)return;match.paused=!match.paused;$('#pauseMenu').classList.toggle('show',match.paused)}
function endMatch(win,quit=false){clearInterval(match?.timer);sessionStorage.removeItem('LESSING_STARS_MATCH');document.onkeydown=null;if(!quit){state.stats.matches++;state.quests.matches++;state.quests.kos+=match.kos;state.quests.damage+=match.damage;state.stats.kos+=match.kos;state.passXP+=20+(win?20:0);if(win){state.stats.wins++;state.quests.wins++;if(!match.training){const gain=rand(8,16);state.trophies+=gain;state.trophiesBy[state.selected]=(state.trophiesBy[state.selected]||0)+gain}}else state.stats.losses++;state.stats.bestTrophies=Math.max(state.stats.bestTrophies,state.trophies);if(state.club)state.club.points+=win?15:5;save();modal(win?'SIEG!':'NIEDERLAGE',`<div class="stats-grid"><div class="stat"><b>${match.kos}</b>KOs</div><div class="stat"><b>${match.damage}</b>Schaden</div><div class="stat"><b>+${20+(win?20:0)}</b>Pass-XP</div></div><p>${win&&!match.training?'Trophäen gewonnen!':match.training?'Training beendet.':'Nächstes Match wartet.'}</p>`,`<button class="btn gold" id="resultHome">LOBBY</button><button class="btn green" id="resultAgain">NOCHMAL</button>`);$('#resultHome').onclick=()=>{closeModal();go('home')};$('#resultAgain').onclick=()=>{closeModal();startMatch(match.training)}}else go('play')}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function onboard(){if(state.onboarded)return;let step=0;const steps=[{t:'Willkommen bei Lessing Stars',b:'Du startest mit Hamza.S., 1500 Münzen, 100 Juwelen und 1000 Powerpunkten.'},{t:'Wähle deinen Modus',b:'Showdown, Juwelenjagd, Kontrolle und weitere Events warten auf dich.'},{t:'Sammle & verbessere',b:'Öffne L-Drops und Mega-Boxen, erledige Quests und schalte neue Brawler frei.'},{t:'Bereit?',b:'Gib optional deinen Spielernamen ein und starte dein erstes Training.'}];const draw=()=>{const x=steps[step],m=modal(x.t,`<div class="onboard"><div class="onboard-art">${step===0?'H':step===1?'M':step===2?'L':'★'}</div><div><div class="onboard-steps">${steps.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div><p>${x.b}</p>${step===3?'<label class="label">Spielername<input class="input" id="onName" placeholder="optional"></label>':''}</div></div>`,`<button class="btn ${step?'':'ghost'}" id="onBack" ${step?'':'disabled'}>ZURÜCK</button><button class="btn gold" id="onNext">${step===steps.length-1?'STARTEN':'WEITER'}</button>`);$('#onBack').onclick=()=>{if(step){step--;draw()}};$('#onNext').onclick=()=>{if(step<steps.length-1){step++;draw()}else{const n=$('#onName')?.value.trim();if(n)state.name=n;state.onboarded=true;save();closeModal();toast('Hamza.S. ist bereit!')}}};draw()}

let audioCtx=null;function clickSound(){if(!state.settings.sfx)return;try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=420;g.gain.setValueAtTime(.025,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.05);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.055)}catch{}}
document.addEventListener('click',e=>{if(e.target.closest('button'))clickSound()},true);

function preload(){const imgs=['assets/visual/home.png','assets/visual/shop.png','assets/visual/brawler.png','assets/visual/drops.png','assets/visual/login.png','assets/visual/quick.png'];return Promise.allSettled(imgs.map(src=>new Promise(res=>{const i=new Image();i.onload=i.onerror=res;i.src=src})))}
window.onerror=(msg,src,line,col)=>{console.error(msg,src,line,col);toast('Ein Fehler wurde abgefangen. Die Lobby bleibt verfügbar.')};
window.addEventListener('unhandledrejection',e=>{console.error(e.reason);toast('Ein Hintergrundfehler wurde abgefangen.')});
window.addEventListener('hashchange',()=>{const m=location.hash.match(/^#\/stars\/([\w-]+)/);if(m&&m[1]!==current)go(m[1])});
$('#drawerOverlay').onclick=e=>{if(e.target===$('#drawerOverlay'))closeDrawer()};
$('#modalWrap').onclick=e=>{if(e.target===$('#modalWrap'))closeModal()};
renderNav($('#homeNav'),'');wireCommon($('#screen-home'));renderHud();
preload().finally(()=>{setTimeout(()=>$('#loading').classList.add('hide'),700);setTimeout(()=>{const old=sessionStorage.getItem('LESSING_STARS_MATCH');if(old&&!state.onboarded)return onboard();if(old){const m=modal('Match wiederherstellen','<p>Ein vorheriges Match wurde nicht sauber beendet. Möchtest du wieder einsteigen?</p>','<button class="btn" id="discardMatch">VERWERFEN</button><button class="btn green" id="reconnectMatch">WIEDER VERBINDEN</button>');$('#discardMatch').onclick=()=>{sessionStorage.removeItem('LESSING_STARS_MATCH');closeModal()};$('#reconnectMatch').onclick=()=>{sessionStorage.removeItem('LESSING_STARS_MATCH');closeModal();startMatch(false)}}else onboard()},900)});
if(location.hash.startsWith('#/stars/')){const m=location.hash.match(/^#\/stars\/([\w-]+)/);if(m)go(m[1])}
</script>
</body>
