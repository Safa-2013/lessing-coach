<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lessing Stars</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07162d;font-family:Arial,Helvetica,sans-serif}body{display:grid;place-items:center}
#app{position:relative;width:min(100vw,177.683vh);aspect-ratio:1672/941;overflow:hidden;background:#07162d;box-shadow:0 0 80px #000}
.screen{position:absolute;inset:0;display:none}.screen.active{display:block}.screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.hot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:12px;z-index:10;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.hot:hover{background:#fff1}.hot:active{background:#fff3;transform:scale(.985)}.hot:focus-visible{outline:3px solid #fff9;background:#fff1}
#toast{position:absolute;left:50%;bottom:2.2%;transform:translateX(-50%);z-index:60;background:#0b213eef;border:2px solid #ffd84e;color:#fff;padding:.8% 1.3%;border-radius:12px;font-weight:800;font-size:clamp(10px,1.05vw,18px);opacity:0;pointer-events:none;transition:opacity .18s}#toast.show{opacity:1}
#loginForm{display:none;position:absolute;z-index:20;left:42.2%;top:29.8%;width:29.7%;height:27%}#login.active~#loginForm{display:block}.field{position:absolute;left:0;width:100%;height:26%;border:0;background:transparent;color:#fff;font-size:clamp(12px,1.2vw,22px);padding:0 7%;outline:none}.field::placeholder{color:#dbe8ffb0}.field.user{top:0}.field.pass{top:42%}
#menuCoach{display:none;position:absolute;z-index:30;right:2.25%;bottom:2.3%;width:25.8%;height:7.2%;border:2px solid #66a8e9;border-radius:12px;background:linear-gradient(#3678b7,#15375d);color:#fff;font-size:clamp(10px,1.2vw,22px);font-weight:900;cursor:pointer;box-shadow:0 4px 0 #06182d}#quick.active~#menuCoach{display:block}#menuCoach:hover{filter:brightness(1.12)}
#portrait{display:none;position:fixed;inset:0;background:linear-gradient(160deg,#07172e,#123b73);z-index:100;color:#fff;place-items:center;text-align:center;padding:28px}#portrait .card{max-width:420px;background:#0a2448;border:3px solid #67a8eb;border-radius:24px;padding:28px;box-shadow:0 20px 60px #0008}#portrait b{font-size:30px;display:block;margin-bottom:10px;color:#ffe15b}#portrait span{font-size:18px;line-height:1.5}@media (orientation:portrait) and (max-width:900px){#portrait{display:grid}}
</style></head><body>
<div id="app" aria-label="Lessing Stars">
<section id="home" class="screen active"><img src="assets/visual/home.png" alt="Lessing Stars Lobby"></section>
<section id="shop" class="screen"><img src="assets/visual/shop.png" alt="Lessing Stars Shop"></section>
<section id="brawler" class="screen"><img src="assets/visual/brawler.png" alt="Lessing Stars Brawler"></section>
<section id="drops" class="screen"><img src="assets/visual/drops.png" alt="Lessing Stars L-Drops und Mega-Boxen"></section>
<section id="login" class="screen"><img src="assets/visual/login.png" alt="Lessing Stars Anmeldung"></section>
<section id="quick" class="screen"><img src="assets/visual/quick.png" alt="Lessing Stars Seitenleiste rechts"></section>
<form id="loginForm" autocomplete="off"><input class="field user" name="user" aria-label="Benutzername" placeholder="Dein Benutzername ..."><input class="field pass" type="password" name="pass" aria-label="Passwort" placeholder="Dein Passwort ..."></form>
<button id="menuCoach">← ZURÜCK ZUM TERMINPLANER</button><div id="toast" role="status"></div>
</div>
<div id="portrait"><div class="card"><b>Bitte Gerät drehen</b><span>Lessing Stars ist für Querformat optimiert.</span></div></div>
<script>
const app=document.getElementById('app'),screens=[...document.querySelectorAll('.screen')];
const show=id=>{screens.forEach(s=>s.classList.toggle('active',s.id===id));installHotspots(id)};
const toast=t=>{const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>el.classList.remove('show'),1500)};
const btn=(x,y,w,h,fn,label='')=>{const b=document.createElement('button');b.className='hot';Object.assign(b.style,{left:x+'%',top:y+'%',width:w+'%',height:h+'%'});b.setAttribute('aria-label',label);b.onclick=fn;app.appendChild(b);return b};
const clearHot=()=>document.querySelectorAll('.hot').forEach(x=>x.remove());
const notReady=n=>()=>toast(n+' wird als nächstes verbunden.');
function homeSpots(){
 // Linke Leiste – exakt auf den sichtbaren Buttons
 btn(1.45,20.8,13.0,9.6,()=>show('shop'),'Shop');btn(1.45,30.5,13.0,9.6,()=>show('brawler'),'Brawler');btn(1.45,40.2,13.0,9.6,notReady('Pass'),'Pass');btn(1.45,49.9,13.0,9.6,notReady('Quests'),'Quests');btn(1.45,59.6,13.0,9.6,notReady('Freunde'),'Freunde');btn(1.45,69.3,13.0,9.6,notReady('Club'),'Club');btn(1.45,79.0,13.0,9.6,notReady('Profil'),'Profil');btn(1.45,88.7,13.0,9.2,notReady('Einstellungen'),'Einstellungen');
 // Rechte Leiste
 btn(90.4,15.7,8.1,16.0,notReady('Events'),'Events');btn(90.4,34.1,8.1,14.8,notReady('Freunde'),'Freunde');btn(90.4,50.3,8.1,16.0,notReady('Club'),'Club');
 // Kopf & untere Karten
 btn(93.2,1.4,5.4,8.8,()=>show('quick'),'Menü');btn(15.0,82.4,12.7,13.6,()=>toast('Tägliche Belohnung abgeholt!'),'Tägliche Belohnung');btn(28.1,80.2,14.3,15.6,()=>toast('Showdown ausgewählt'),'Showdown');btn(43.1,80.2,14.3,15.6,()=>toast('Juwelenjagd ausgewählt'),'Juwelenjagd');btn(58.0,80.2,14.3,15.6,()=>toast('Kontrolle ausgewählt'),'Kontrolle');btn(73.0,77.7,24.0,18.2,()=>toast('Spiel starten'),'Spielen');
}
function leftNav(y,id,label){btn(0, y, 15.0, 9.5, id?()=>show(id):notReady(label),label)}
function shopSpots(){btn(0,0,8.5,10.0,()=>show('home'),'Zur Lobby');leftNav(10,'shop','Shop');leftNav(20,'brawler','Brawler');leftNav(30,null,'Skins');leftNav(40,'drops','Drops');leftNav(50,null,'Mega Boxen');leftNav(60,null,'Belohnungen');leftNav(70,null,'Quests');leftNav(80,null,'Freunde');leftNav(90,null,'Club')}
function brawlerSpots(){btn(0,0,8.5,10.0,()=>show('home'),'Zur Lobby');btn(0,30,15,10,()=>show('shop'),'Shop');btn(0,40,15,10,()=>show('brawler'),'Brawler');btn(0,50,15,10,notReady('Skins'),'Skins');btn(17,18,15.5,27,()=>toast('Brawler ausgewählt'),'Brawler 1');btn(33.5,18,15.5,27,()=>toast('Brawler ausgewählt'),'Brawler 2');btn(50,18,15.5,27,()=>toast('Brawler ausgewählt'),'Brawler 3');btn(67,85,30,10,()=>toast('Upgrade ausgelöst'),'Upgrade')}
function dropsSpots(){btn(0,0,8.5,10.0,()=>show('home'),'Zur Lobby');btn(0,10,15,8.4,()=>show('shop'),'Shop');btn(0,18.4,15,8.4,()=>show('brawler'),'Brawler');btn(0,26.8,15,8.4,notReady('Skins'),'Skins');btn(0,35.2,15,8.4,()=>show('drops'),'L-Drop');btn(0,43.6,15,8.4,()=>show('drops'),'Mega Box');btn(0,52,15,8.4,notReady('Belohnungen'),'Belohnungen');btn(0,60.4,15,8.4,notReady('Quests'),'Quests');btn(0,68.8,15,8.4,notReady('Freunde'),'Freunde');btn(0,77.2,15,8.4,notReady('Club'),'Club');btn(20.8,82.2,27.0,11.0,()=>openReward('L-Drop'),'L-Drop öffnen');btn(61.0,82.2,27.0,11.0,()=>openReward('Mega-Box'),'Mega-Box öffnen')}
function openReward(kind){const o=document.createElement('div');o.style.cssText='position:absolute;inset:0;z-index:50;background:#061831e8;display:grid;place-items:center;color:white;text-align:center;animation:fade .2s';o.innerHTML='<div style="font-weight:900;font-size:clamp(22px,4vw,66px);text-shadow:0 4px #000">'+kind+'<div style="font-size:.55em;color:#ffe15a;margin-top:18px">✨ Belohnung geöffnet! ✨</div><div style="font-size:.35em;margin-top:14px">Tippe zum Schließen</div></div>';o.onclick=()=>o.remove();app.appendChild(o)}
function loginSpots(){btn(36.0,55.0,35.0,11.0,()=>{toast('Anmeldung gespeichert');show('home')},'Anmelden');btn(36.2,68.0,17.0,9.5,()=>show('home'),'Gast spielen');btn(54.0,68.0,17.0,9.5,notReady('Passwort zurücksetzen'),'Passwort vergessen');btn(36.0,82.0,35.0,9.5,()=>toast('Kontoerstellung geöffnet'),'Neues Konto')}
function quickSpots(){btn(93.2,1.2,5.8,9.0,()=>show('home'),'Menü schließen');btn(70.4,15.0,27.0,8.8,()=>show('login'),'Anmelden');btn(70.4,24.4,27.0,8.8,notReady('Einstellungen'),'Einstellungen');btn(70.4,33.8,27.0,8.8,notReady('Post'),'Post');btn(70.4,43.2,27.0,8.8,notReady('Hilfe'),'Hilfe');btn(70.4,52.6,27.0,8.8,notReady('Support'),'Support');btn(70.4,62.0,27.0,8.8,notReady('Datenschutz'),'Datenschutz');btn(70.4,71.4,27.0,8.8,notReady('Sprache'),'Sprache');btn(70.4,80.8,27.0,8.8,()=>show('login'),'Abmelden')}
function installHotspots(id){clearHot();({home:homeSpots,shop:shopSpots,brawler:brawlerSpots,drops:dropsSpots,login:loginSpots,quick:quickSpots}[id]||(()=>{}))()}
function backToCoach(){try{parent.postMessage({type:'lessing-coach-home'},location.origin)}catch(e){location.href='./index.html'}}
document.getElementById('menuCoach').onclick=backToCoach;installHotspots('home');window.addEventListener('keydown',e=>{if(e.key==='Escape')show('home')});
</script></body></html>
