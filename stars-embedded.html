<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lessing Stars</title>
<style>
:root{color-scheme:dark;--navy:#071a34;--navy2:#0b2a53;--blue:#0e63c9;--line:#4e8ac8;--yellow:#ffd83d;--green:#31d55b;--text:#fff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07162d;font-family:Arial,Helvetica,sans-serif;color:#fff}body{display:grid;place-items:center}
#app{position:relative;width:min(100vw,177.683vh);aspect-ratio:1672/941;overflow:hidden;background:#07162d;box-shadow:0 0 80px #000}
.screen{position:absolute;inset:0;display:none;background:linear-gradient(145deg,#081a35,#0b3d79)}.screen.active{display:block}.screen>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.hot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:12px;z-index:20;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.hot:hover{background:#fff1;box-shadow:inset 0 0 0 2px #fff3}.hot:active{background:#fff3;transform:scale(.985)}.hot:focus-visible{outline:3px solid #fff9;background:#fff1}
#toast{position:absolute;left:50%;bottom:2.2%;transform:translateX(-50%);z-index:90;background:#0b213ef2;border:2px solid #ffd84e;color:#fff;padding:.8% 1.3%;border-radius:12px;font-weight:800;font-size:clamp(10px,1.05vw,18px);opacity:0;pointer-events:none;transition:opacity .18s}#toast.show{opacity:1}
#loginForm{display:none;position:absolute;z-index:30;left:42.2%;top:29.8%;width:29.7%;height:27%}#login.active~#loginForm{display:block}.field{position:absolute;left:0;width:100%;height:26%;border:0;background:transparent;color:#fff;font-size:clamp(12px,1.2vw,22px);padding:0 7%;outline:none}.field::placeholder{color:#dbe8ffb0}.field.user{top:0}.field.pass{top:42%}
/* functional game pages */
.game-page{position:absolute;inset:0;display:grid;grid-template-columns:15% 1fr;background:linear-gradient(135deg,#081a35,#0f4c93);overflow:hidden}.game-side{background:#071d3d;border-right:3px solid #2f6da9;padding:2.2% 1.3%;display:flex;flex-direction:column;gap:1.1%}.game-logo{font-weight:1000;text-align:center;font-size:clamp(18px,2.2vw,38px);line-height:.86;margin-bottom:8%;text-shadow:0 4px #000}.game-logo span{display:block;color:#ffae24}.navbtn{border:2px solid #0b1120;border-radius:12px;background:linear-gradient(#276eb4,#123b70);box-shadow:0 4px 0 #06152a;color:#fff;font-weight:900;font-size:clamp(10px,1.05vw,18px);padding:8% 5%;cursor:pointer}.navbtn.active,.navbtn:hover{background:linear-gradient(#ffd942,#ef9c14);color:#07172d}.game-main{position:relative;padding:3.2% 3.5%;overflow:auto}.page-head{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #ffffff22;padding-bottom:1.4%;margin-bottom:2.4%}.page-head h1{margin:0;font-size:clamp(24px,3vw,52px);text-shadow:0 4px #000}.page-head button{border:0;border-radius:12px;background:#ffd83d;color:#082042;font-weight:900;padding:.9em 1.2em;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.7%}.card{min-height:180px;border:2px solid #4b8ac6;border-radius:18px;background:linear-gradient(145deg,#153e70,#0b274e);padding:5%;box-shadow:0 10px 20px #0003}.card h3{font-size:clamp(17px,1.5vw,27px);margin:.1em 0 .45em}.card p{color:#cfe1ff}.action{border:0;border-radius:10px;background:linear-gradient(#38df58,#16a63b);box-shadow:0 4px 0 #075e27;color:#fff;font-weight:900;padding:.8em 1.1em;cursor:pointer}.action.gold{background:linear-gradient(#ffe75a,#f2a918);box-shadow:0 4px 0 #9b5f00;color:#0a1e36}.action.purple{background:linear-gradient(#c74cff,#7b14d9);box-shadow:0 4px 0 #460078}.statbar{display:grid;grid-template-columns:repeat(4,1fr);gap:1%;margin-bottom:2%}.stat{background:#061c39;border:2px solid #3d79b7;border-radius:12px;text-align:center;padding:1%;font-weight:900}.stat b{color:#ffd83d;font-size:1.25em}.list{display:grid;gap:1.2%}.rowitem{display:flex;align-items:center;justify-content:space-between;gap:2%;background:#0c315c;border:2px solid #4b8ac6;border-radius:14px;padding:1.3% 1.7%;font-weight:800}.avatar{width:52px;height:52px;border-radius:12px;background:linear-gradient(145deg,#14b8ff,#6b42ff);display:grid;place-items:center;font-size:28px}.toggle{display:flex;align-items:center;gap:12px}.toggle input{width:26px;height:26px}
/* rewards */
#rewardOverlay{position:absolute;inset:0;z-index:100;display:none;place-items:center;background:radial-gradient(circle at 50% 45%,#204b9cdd,#031025f2);overflow:hidden}#rewardOverlay.show{display:grid}.reward-stage{text-align:center;max-width:80%;animation:rewardIn .55s cubic-bezier(.2,1.2,.2,1)}.reward-title{font-size:clamp(32px,5vw,90px);font-weight:1000;text-shadow:0 6px #000}.reward-orb{margin:2vh auto;width:min(27vw,300px);aspect-ratio:1;border-radius:26%;display:grid;place-items:center;font-size:clamp(70px,11vw,170px);font-weight:1000;background:linear-gradient(145deg,#5ef,#704cff,#ff51dd);box-shadow:0 0 60px #6af,0 20px 60px #000;animation:shake .55s ease-in-out 2}.reward-items{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:2vh auto}.reward-pill{background:#0b2a53;border:2px solid #6db7ff;border-radius:14px;padding:10px 16px;font-weight:900;animation:pop .35s backwards}.reward-close{border:0;border-radius:14px;background:#ffd83d;color:#071a34;padding:14px 28px;font-weight:1000;font-size:18px;cursor:pointer}@keyframes rewardIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}@keyframes shake{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-5deg) scale(1.05)}75%{transform:rotate(5deg) scale(1.05)}}@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.8)}to{opacity:1;transform:none}}
#portrait{display:none;position:fixed;inset:0;background:linear-gradient(160deg,#07172e,#123b73);z-index:200;color:#fff;place-items:center;text-align:center;padding:28px}#portrait .cardp{max-width:420px;background:#0a2448;border:3px solid #67a8eb;border-radius:24px;padding:28px;box-shadow:0 20px 60px #0008}#portrait b{font-size:30px;display:block;margin-bottom:10px;color:#ffe15b}#portrait span{font-size:18px;line-height:1.5}@media (orientation:portrait) and (max-width:900px){#portrait{display:grid}}
</style>
</head><body>
<div id="app" aria-label="Lessing Stars">
<section id="home" class="screen active"><img class="bg" src="assets/visual/home.png" alt="Lessing Stars Lobby"></section>
<section id="shop" class="screen"><img class="bg" src="assets/visual/shop.png" alt="Lessing Stars Shop"></section>
<section id="brawler" class="screen"><img class="bg" src="assets/visual/brawler.png" alt="Lessing Stars Brawler"></section>
<section id="drops" class="screen"><img class="bg" src="assets/visual/drops.png" alt="Lessing Stars L-Drops und Mega-Boxen"></section>
<section id="login" class="screen"><img class="bg" src="assets/visual/login.png" alt="Lessing Stars Anmeldung"></section>
<section id="quick" class="screen"><img class="bg" src="assets/visual/quick.png" alt="Lessing Stars Schnellmenü"></section>

<section id="pass" class="screen"></section><section id="quests" class="screen"></section><section id="friends" class="screen"></section><section id="club" class="screen"></section><section id="profile" class="screen"></section><section id="settings" class="screen"></section><section id="skins" class="screen"></section><section id="events" class="screen"></section><section id="play" class="screen"></section>
<form id="loginForm" autocomplete="off"><input class="field user" name="user" aria-label="Benutzername" placeholder="Dein Benutzername ..."><input class="field pass" type="password" name="pass" aria-label="Passwort" placeholder="Dein Passwort ..."></form>
<div id="toast" role="status"></div>
<div id="rewardOverlay" aria-live="polite"></div>
</div>
<div id="portrait"><div class="cardp"><b>Bitte Gerät drehen</b><span>Lessing Stars ist für Querformat optimiert.</span></div></div>
<script>
const app=document.getElementById('app'),screens=[...document.querySelectorAll('.screen')];
const defaultState={coins:1500,gems:100,power:1000,tickets:45,trophies:0,drops:2,boxes:0,skin:'Klassisch'};
let state={...defaultState,...JSON.parse(localStorage.getItem('lessingStarsState')||'{}')};
const save=()=>localStorage.setItem('lessingStarsState',JSON.stringify(state));
const toast=t=>{const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>el.classList.remove('show'),1800)};
const btn=(x,y,w,h,fn,label='')=>{const b=document.createElement('button');b.className='hot';Object.assign(b.style,{left:x+'%',top:y+'%',width:w+'%',height:h+'%'});b.setAttribute('aria-label',label);b.onclick=fn;app.appendChild(b);return b};
const clearHot=()=>document.querySelectorAll('.hot').forEach(x=>x.remove());
const show=id=>{screens.forEach(s=>s.classList.toggle('active',s.id===id)); if(!['home','shop','brawler','drops','login','quick'].includes(id)) renderPage(id); installHotspots(id)};
function coach(){try{parent.postMessage({type:'lessing-coach-home'},location.origin)}catch(e){location.href='./index.html'}}
function visualNav(y,id,label){btn(0,y,15,8.6,()=>show(id),label)}
function homeSpots(){
 btn(1.1,21.2,13.3,9.0,()=>show('shop'),'Shop');btn(1.1,31.0,13.3,9.0,()=>show('brawler'),'Brawler');btn(1.1,40.8,13.3,9.0,()=>show('pass'),'Pass');btn(1.1,50.6,13.3,9.0,()=>show('quests'),'Quests');btn(1.1,60.4,13.3,9.0,()=>show('friends'),'Freunde');btn(1.1,70.2,13.3,9.0,()=>show('club'),'Club');btn(1.1,80.0,13.3,9.0,()=>show('profile'),'Profil');btn(1.1,89.1,13.3,8.3,()=>show('settings'),'Einstellungen');
 btn(90.1,19.9,8.3,13.0,()=>show('events'),'Events');btn(90.1,35.3,8.3,13.0,()=>show('friends'),'Freunde');btn(90.1,50.9,8.3,13.0,()=>show('club'),'Club');
 btn(93.7,1.6,4.8,8.0,()=>show('quick'),'Menü');btn(1.2,84.0,16.7,12.6,()=>{state.coins+=100;save();toast('Tägliche Belohnung: +100 Münzen')},'Tägliche Belohnung');
 btn(19.3,82.0,17.3,14.5,()=>toast('Showdown ausgewählt'),'Showdown');btn(37.1,82.0,17.3,14.5,()=>toast('Juwelenjagd ausgewählt'),'Juwelenjagd');btn(55.0,82.0,17.3,14.5,()=>toast('Kontrolle ausgewählt'),'Kontrolle');btn(74.2,78.3,23.3,17.2,()=>show('play'),'Spielen');
}
function shopSpots(){btn(0,0,8.5,10,()=>show('home'),'Lobby');visualNav(10,'shop','Shop');visualNav(20,'brawler','Brawler');visualNav(30,'skins','Skins');visualNav(40,'play','Math Game');visualNav(50,'profile','Ressourcen');visualNav(60,'settings','Sonstiges');btn(15.8,18,21.5,66,()=>buyBundle(),'Starter-Paket');btn(39,18,18,66,()=>buySkin('Lessing-Hero',149),'Skin');btn(58.2,18,17.5,66,()=>buyBrawler(),'Brawler-Angebot');btn(76.5,20,22,65,()=>toast('Tägliche Angebote geöffnet'),'Tägliche Angebote')}
function brawlerSpots(){btn(0,0,8.5,10,()=>show('home'),'Lobby');btn(0,30,15,10,()=>show('shop'),'Shop');btn(0,40,15,10,()=>show('brawler'),'Brawler');btn(0,50,15,10,()=>show('skins'),'Skins');btn(0,60,15,10,()=>show('profile'),'Ressourcen');btn(0,70,15,10,()=>show('quests'),'Quests');btn(0,80,15,10,()=>show('club'),'Club');btn(0,90,15,9,()=>show('settings'),'Sonstiges');for(let r=0;r<3;r++)for(let c=0;c<3;c++)btn(16.7+c*17.5,20+r*27,16,24,()=>toast('Brawler ausgewählt'),'Brawler auswählen');btn(67,84,30,10,()=>{if(state.coins>=400){state.coins-=400;state.power=Math.max(0,state.power-20);save();toast('Brawler verbessert!')}else toast('Nicht genug Münzen')},'Upgrade')}
function dropsSpots(){btn(0,0,8.5,10,()=>show('home'),'Lobby');visualNav(10,'shop','Shop');visualNav(18.4,'brawler','Brawler');visualNav(26.8,'skins','Skins');visualNav(35.2,'drops','L-Drop');visualNav(43.6,'drops','Mega Box');visualNav(52,'quests','Belohnungen');visualNav(60.4,'quests','Quests');visualNav(68.8,'friends','Freunde');visualNav(77.2,'club','Club');visualNav(85.6,'profile','Profil');
 btn(20.8,82.0,27.0,11.2,()=>openReward('L-Drop'),'L-Drop öffnen');btn(61.0,82.0,27.0,11.2,()=>openReward('Mega-Box'),'Mega-Box öffnen')}
function loginSpots(){btn(36,55,35,11,()=>{const u=document.querySelector('.field.user').value.trim();toast(u?'Angemeldet':'Bitte Benutzername eingeben');if(u)show('home')},'Anmelden');btn(36.2,68,17,9.5,()=>show('home'),'Gast spielen');btn(54,68,17,9.5,()=>toast('Passwort-Hilfe geöffnet'),'Passwort vergessen');btn(36,82,35,9.5,()=>toast('Konto kann erstellt werden'),'Neues Konto')}
function quickSpots(){btn(93.2,1.2,5.8,9,()=>show('home'),'Schließen');btn(70.4,15,27,8.8,()=>show('login'),'Anmelden');btn(70.4,24.4,27,8.8,()=>show('settings'),'Einstellungen');btn(70.4,33.8,27,8.8,()=>toast('Keine neuen Nachrichten'),'Post');btn(70.4,43.2,27,8.8,()=>toast('Hilfe geöffnet'),'Hilfe');btn(70.4,52.6,27,8.8,()=>toast('Support geöffnet'),'Support');btn(70.4,62,27,8.8,()=>toast('Datenschutz geöffnet'),'Datenschutz');btn(70.4,71.4,27,8.8,()=>toast('Sprache: Deutsch'),'Sprache');btn(70.4,80.8,27,8.8,()=>show('login'),'Abmelden');btn(1.5,1.6,23,8.5,coach,'Zurück zum Terminplaner')}
function installHotspots(id){clearHot();({home:homeSpots,shop:shopSpots,brawler:brawlerSpots,drops:dropsSpots,login:loginSpots,quick:quickSpots}[id]||(()=>{}))()}
function buyBundle(){if(state.gems<10)return toast('Nicht genug Juwelen');state.gems-=10;state.coins+=2000;state.boxes+=3;save();toast('Starter-Paket erhalten!')}
function buySkin(name,cost){if(state.gems<cost)return toast('Nicht genug Juwelen');state.gems-=cost;state.skin=name;save();toast(name+' gekauft!')}
function buyBrawler(){if(state.gems<349)return toast('Nicht genug Juwelen');state.gems-=349;save();toast('Neuer Brawler freigeschaltet!')}
const rewardPool=['🪙 150 Münzen','💎 8 Juwelen','⚡ 120 Powerpunkte','🎫 2 Tickets','⭐ 25 Credits','🎨 Skin-Teil','🏆 15 Trophäen'];
function openReward(kind){
 if(kind==='L-Drop'){if(state.drops<1)return toast('Kein L-Drop vorhanden');state.drops--;}
 else{if(state.boxes<1)return toast('Keine Mega-Box vorhanden');state.boxes--;}
 const count=kind==='L-Drop'?(1+Math.floor(Math.random()*3)):(4+Math.floor(Math.random()*5));
 const rarityRoll=Math.random(),rarity=rarityRoll<.01?'LEGENDÄR':rarityRoll<.05?'MYTHISCH':rarityRoll<.14?'EPISCH':rarityRoll<.38?'SUPERSELTEN':'SELTEN';
 const items=Array.from({length:count},()=>rewardPool[Math.floor(Math.random()*rewardPool.length)]);
 items.forEach(i=>{if(i.includes('Münzen'))state.coins+=150;if(i.includes('Juwelen'))state.gems+=8;if(i.includes('Power'))state.power+=120;if(i.includes('Tickets'))state.tickets+=2;if(i.includes('Trophäen'))state.trophies+=15;});save();
 const o=document.getElementById('rewardOverlay');o.innerHTML=`<div class="reward-stage"><div class="reward-title">${kind}</div><div class="reward-orb">L</div><div style="font-weight:1000;color:#ffe25b;font-size:clamp(18px,2.6vw,42px)">${rarity}</div><div class="reward-items">${items.map((x,i)=>`<div class="reward-pill" style="animation-delay:${i*.1}s">${x}</div>`).join('')}</div><button class="reward-close">WEITER</button></div>`;o.classList.add('show');o.querySelector('button').onclick=()=>{o.classList.remove('show');show('drops')};
}
function shell(title,body,active){return `<div class="game-page"><aside class="game-side"><div class="game-logo">LESSING<span>STARS</span></div>${[['home','LOBBY'],['shop','SHOP'],['brawler','BRAWLER'],['skins','SKINS'],['quests','QUESTS'],['friends','FREUNDE'],['club','CLUB'],['profile','PROFIL'],['settings','EINSTELLUNGEN']].map(([id,l])=>`<button class="navbtn ${id===active?'active':''}" data-go="${id}">${l}</button>`).join('')}</aside><main class="game-main"><div class="page-head"><h1>${title}</h1><button data-go="home">← LOBBY</button></div>${body}</main></div>`}
function renderPage(id){const s=document.getElementById(id);let html='';
 if(id==='pass')html=shell('BRAWL PASS',`<div class="statbar"><div class="stat">STUFE<br><b>1</b></div><div class="stat">TROPHÄEN<br><b>${state.trophies}</b></div><div class="stat">TICKETS<br><b>${state.tickets}</b></div><div class="stat">CREDITS<br><b>0</b></div></div><div class="cards">${[1,2,3,4,5,6].map((n,i)=>`<div class="card"><h3>Stufe ${n}</h3><p>${i%2?'Mega-Box':'L-Drop'} + Münzen</p><button class="action gold" data-reward="${i%2?'Mega-Box':'L-Drop'}">ABHOLEN</button></div>`).join('')}</div>`,'pass');
 if(id==='quests')html=shell('QUESTS & BELOHNUNGEN',`<div class="cards"><div class="card"><h3>3 Matches spielen</h3><p>0 / 3</p><button class="action">+ 200 Münzen</button></div><div class="card"><h3>1 Match gewinnen</h3><p>0 / 1</p><button class="action">+ 50 Credits</button></div><div class="card"><h3>5 Gegner besiegen</h3><p>0 / 5</p><button class="action">+ 1 L-Drop</button></div></div><h2>Trophäenpfad</h2><div class="list">${[25,50,75,100,125,150,175,200,225,250].map(x=>`<div class="rowitem"><span>${x} Trophäen</span><button class="action gold">ABHOLEN</button></div>`).join('')}</div>`,'quests');
 if(id==='friends')html=shell('FREUNDE',`<div class="page-head"><div><h2>Freundesliste</h2><p>Spiele gemeinsam mit anderen.</p></div><button id="addFriend">+ FREUND HINZUFÜGEN</button></div><div class="list">${['Emre','Lina','Yusuf','Nela','Kian'].map((n,i)=>`<div class="rowitem"><span style="display:flex;align-items:center;gap:12px"><span class="avatar">${i%2?'👧':'👦'}</span>${n}<small style="color:#6cff90"> • online</small></span><button class="action">EINLADEN</button></div>`).join('')}</div>`,'friends');
 if(id==='club')html=shell('CLUB',`<div class="card"><h3>Lessing Stars Club</h3><p>Gemeinsam spielen, Punkte sammeln und Club-Belohnungen freischalten.</p><div class="statbar"><div class="stat">MITGLIEDER<br><b>12/30</b></div><div class="stat">CLUB-PUNKTE<br><b>1.840</b></div><div class="stat">RANG<br><b>Silber</b></div><div class="stat">ONLINE<br><b>3</b></div></div><button class="action gold">CLUB ÖFFNEN</button></div>`,'club');
 if(id==='profile')html=shell('PROFIL',`<div class="cards"><div class="card"><div class="avatar" style="width:100px;height:100px;font-size:60px">🎓</div><h3>Spielerprofil</h3><p>Trophäen: ${state.trophies}</p></div><div class="card"><h3>Ressourcen</h3><p>🪙 ${state.coins} Münzen</p><p>💎 ${state.gems} Juwelen</p><p>⚡ ${state.power} Powerpunkte</p><p>🎫 ${state.tickets} Tickets</p></div><div class="card"><h3>Aktiver Skin</h3><p>${state.skin}</p><button class="action purple" data-go="skins">SKINS</button></div></div>`,'profile');
 if(id==='settings')html=shell('EINSTELLUNGEN',`<div class="list"><label class="rowitem">Musik <span class="toggle"><input type="checkbox" checked></span></label><label class="rowitem">Soundeffekte <span class="toggle"><input type="checkbox" checked></span></label><label class="rowitem">Animationen <span class="toggle"><input type="checkbox" checked></span></label><div class="rowitem"><span>Sprache</span><button class="action">Deutsch</button></div><div class="rowitem"><span>Terminplaner</span><button id="coachBack" class="action gold">ZURÜCK ZUM TERMINPLANER</button></div><div class="rowitem"><span>Spielstand</span><button id="resetGame" class="action">ZURÜCKSETZEN</button></div></div>`,'settings');
 if(id==='skins')html=shell('SKINS',`<div class="cards">${['Klassisch','Neonblau','Gold','Violett','Jade','Lessing-Hero'].map((n,i)=>`<div class="card"><div class="avatar" style="width:100%;height:110px;font-size:64px">${['🎓','💙','👑','💜','💚','⭐'][i]}</div><h3>${n}</h3><p>${state.skin===n?'Ausgewählt':'50 Juwelen'}</p><button class="action ${state.skin===n?'':'purple'}" data-skin="${n}">${state.skin===n?'AUSGEWÄHLT':'KAUFEN / AUSWÄHLEN'}</button></div>`).join('')}</div>`,'skins');
 if(id==='events')html=shell('EVENTS',`<div class="cards"><div class="card"><h3>Schulhof-Chaos</h3><p>Showdown · täglich</p><button class="action gold" data-go="play">SPIELEN</button></div><div class="card"><h3>Wissensmine</h3><p>Juwelenjagd · Event</p><button class="action gold" data-go="play">SPIELEN</button></div><div class="card"><h3>Aula-Arena</h3><p>Kontrolle · Event</p><button class="action gold" data-go="play">SPIELEN</button></div></div>`,'events');
 if(id==='play')html=shell('SPIELEN',`<div class="cards"><div class="card"><h3>Showdown · Schulhof</h3><p>Bis zu 10 Spieler. Letzter Spieler gewinnt.</p><button class="action gold" id="quickPlay">SCHNELLSPIEL</button></div><div class="card"><h3>Mit Freunden spielen</h3><p>Erstelle einen Raum oder tritt mit Code bei.</p><input id="roomCode" placeholder="ABC123" style="width:100%;padding:12px;border-radius:10px;border:2px solid #4b8ac6;background:#071d3d;color:#fff"><br><br><button class="action">RAUM ERSTELLEN</button></div><div class="card"><h3>Training</h3><p>Teste Brawler und Steuerung gegen Bots.</p><button class="action">TRAINING STARTEN</button></div></div>`,'play');
