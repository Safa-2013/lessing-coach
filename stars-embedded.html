<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lessing Stars</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07162d;font-family:Arial,Helvetica,sans-serif}
body{display:grid;place-items:center}
#app{position:relative;width:min(100vw,177.683vh);aspect-ratio:1672/941;overflow:hidden;background:#07162d;box-shadow:0 0 80px #000}
.screen{position:absolute;inset:0;display:none}.screen.active{display:block}
.screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.hot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:12px;z-index:5;touch-action:manipulation}
.hot:hover,.hot:focus-visible{outline:3px solid #fff8;background:#fff1}
#coachBtn{position:absolute;left:1.1%;top:12.9%;z-index:20;border:2px solid #18314f;border-radius:8px;background:linear-gradient(#3e78af,#15385f);color:#fff;font-weight:900;font-size:clamp(7px,.72vw,13px);padding:.45% .75%;cursor:pointer;box-shadow:0 3px 0 #07182b}
#coachBtn:hover{filter:brightness(1.15)}
#toast{position:absolute;left:50%;bottom:2.2%;transform:translateX(-50%);z-index:40;background:#0b213eeb;border:2px solid #ffd84e;color:#fff;padding:.8% 1.3%;border-radius:12px;font-weight:800;font-size:clamp(10px,1.05vw,18px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#portrait{display:none;position:fixed;inset:0;background:linear-gradient(160deg,#07172e,#123b73);z-index:100;color:#fff;place-items:center;text-align:center;padding:28px}
#portrait .card{max-width:420px;background:#0a2448;border:3px solid #67a8eb;border-radius:24px;padding:28px;box-shadow:0 20px 60px #0008}
#portrait b{font-size:30px;display:block;margin-bottom:10px;color:#ffe15b}
#portrait span{font-size:18px;line-height:1.5}
@media (orientation:portrait) and (max-width:900px){#portrait{display:grid}}
</style>
</head>
<body>
<div id="app" aria-label="Lessing Stars">
  <section id="home" class="screen active"><img src="assets/visual/home.png" alt="Lessing Stars Lobby"></section>
  <section id="shop" class="screen"><img src="assets/visual/shop.png" alt="Lessing Stars Shop"></section>
  <section id="brawler" class="screen"><img src="assets/visual/brawler.png" alt="Lessing Stars Brawler"></section>
  <section id="drops" class="screen"><img src="assets/visual/drops.png" alt="Lessing Stars L-Drops und Mega-Boxen"></section>
  <section id="login" class="screen"><img src="assets/visual/login.png" alt="Lessing Stars Anmeldung"></section>
  <section id="quick" class="screen"><img src="assets/visual/quick.png" alt="Lessing Stars Seitenleiste rechts"></section>
  <button id="coachBtn">← Lessing Coach</button>
  <div id="toast" role="status"></div>
</div>
<div id="portrait"><div class="card"><b>Bitte Gerät drehen</b><span>Lessing Stars ist als Spieloberfläche für Querformat optimiert.</span></div></div>
<script>
const app=document.getElementById('app');
const screens=[...document.querySelectorAll('.screen')];
const show=id=>{screens.forEach(s=>s.classList.toggle('active',s.id===id));installHotspots(id)};
const toast=t=>{const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>el.classList.remove('show'),1500)};
const btn=(x,y,w,h,fn,label='')=>{const b=document.createElement('button');b.className='hot';b.style.left=x+'%';b.style.top=y+'%';b.style.width=w+'%';b.style.height=h+'%';b.setAttribute('aria-label',label);b.onclick=fn;app.appendChild(b);return b};
const clearHot=()=>document.querySelectorAll('.hot').forEach(x=>x.remove());
function homeSpots(){
 btn(1.2,22.2,7.0,11.5,()=>show('shop'),'Shop');
 btn(1.2,35.0,7.0,11.5,()=>show('brawler'),'Brawler');
 btn(1.2,48.0,7.0,11.5,()=>toast('Pass-Ansicht kommt als Nächstes'),'Pass');
 btn(90.8,22.0,7.0,11.5,()=>toast('Events'),'Events');
 btn(90.8,35.0,7.0,11.5,()=>toast('Freunde'),'Freunde');
 btn(90.8,48.0,7.0,11.5,()=>toast('Club'),'Club');
 btn(93.2,1.5,5.0,8.2,()=>show('quick'),'Menü öffnen');
 btn(72.7,78.0,24.0,17.0,()=>toast('Spielansicht wird im nächsten Schritt angeschlossen'),'Spielen');
 btn(18.8,77.2,17.0,16.3,()=>toast('Showdown ausgewählt'),'Showdown');
 btn(36.5,77.2,17.0,16.3,()=>toast('Juwelenjagd ausgewählt'),'Juwelenjagd');
 btn(54.3,77.2,17.0,16.3,()=>toast('Kontrolle ausgewählt'),'Kontrolle');
}
function shopSpots(){
 btn(0,0,7.5,10.5,()=>show('home'),'Zur Lobby');
 btn(0,10,14.5,11,()=>show('shop'),'Shop');
 btn(0,21,14.5,11,()=>show('brawler'),'Brawler');
 btn(0,32,14.5,11,()=>toast('Skins'),'Skins');
 btn(0,43,14.5,11,()=>show('drops'),'Drops');
}
function brawlerSpots(){
 btn(0,0,7.5,10.5,()=>show('home'),'Zur Lobby');
 btn(0,10,14.5,11,()=>show('shop'),'Shop');
 btn(0,21,14.5,11,()=>show('brawler'),'Brawler');
 btn(0,32,14.5,11,()=>toast('Skins'),'Skins');
 btn(0,43,14.5,11,()=>show('drops'),'Drops');
}
function dropsSpots(){
 btn(0,0,7.5,10.5,()=>show('home'),'Zur Lobby');
 btn(0,10,14.5,8.5,()=>show('shop'),'Shop');
 btn(0,18.5,14.5,8.5,()=>show('brawler'),'Brawler');
 btn(0,27.0,14.5,8.5,()=>toast('Skins'),'Skins');
 btn(0,35.5,14.5,8.5,()=>show('drops'),'Drops');
 btn(21,82,27,11,()=>toast('L-Drop Öffnungsanimation wird angeschlossen'),'L-Drop öffnen');
 btn(61,82,27,11,()=>toast('Mega-Box Öffnungsanimation wird angeschlossen'),'Mega-Box öffnen');
}
function loginSpots(){
 btn(36.4,56.0,34.0,10.0,()=>{toast('Anmeldung');show('home')},'Anmelden');
 btn(36.4,68.4,16.5,9.0,()=>show('home'),'Gast spielen');
 btn(54.2,68.4,16.5,9.0,()=>toast('Passwort vergessen'),'Passwort vergessen');
}
function quickSpots(){
 btn(93.5,1.4,5.4,8.4,()=>show('home'),'Menü schließen');
 btn(70.7,15.4,26.0,8.5,()=>show('login'),'Anmelden');
 btn(70.7,24.8,26.0,8.5,()=>toast('Einstellungen'),'Einstellungen');
 btn(70.7,34.3,26.0,8.5,()=>toast('Post'),'Post');
 btn(70.7,43.8,26.0,8.5,()=>toast('Hilfe'),'Hilfe');
 btn(70.7,53.3,26.0,8.5,()=>toast('Support'),'Support');
 btn(70.7,62.8,26.0,8.5,()=>toast('Datenschutz'),'Datenschutz');
 btn(70.7,72.3,26.0,8.5,()=>toast('Sprache'),'Sprache');
 btn(70.7,81.8,26.0,8.5,()=>show('login'),'Abmelden');
}
function installHotspots(id){clearHot();({home:homeSpots,shop:shopSpots,brawler:brawlerSpots,drops:dropsSpots,login:loginSpots,quick:quickSpots}[id]||(()=>{}))()}
installHotspots('home');
document.getElementById('coachBtn').onclick=()=>{try{parent.postMessage({type:'lessing-coach-home'},location.origin)}catch{};window.location.href='/coach.html'};
window.addEventListener('keydown',e=>{if(e.key==='Escape')show('home')});
</script>
</body>
</html>
