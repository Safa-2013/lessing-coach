<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lessing Stars</title>
<style>
:root{--navy:#071a34;--navy2:#0b2a53;--blue:#0e63c9;--line:#4e8ac8;--yellow:#ffd83d;--green:#31d55b;--text:#fff;--muted:#cfe1ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06142a;font-family:Arial,Helvetica,sans-serif;color:#fff}
body{display:grid;place-items:center}button,input,select{font:inherit}
#app{position:relative;width:min(100vw,177.683vh);aspect-ratio:1672/941;overflow:hidden;background:#07162d;box-shadow:0 0 80px #000}
.screen{position:absolute;inset:0;display:none;background:linear-gradient(145deg,#081a35,#0b3d79)}.screen.active{display:block}
.screen>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.hot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:14px;z-index:30;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.hot:hover{background:#fff1;box-shadow:inset 0 0 0 3px #fff3}.hot:active{background:#fff3;transform:scale(.98)}.hot:focus-visible{outline:4px solid #fff9;outline-offset:-3px}
#toast{position:absolute;left:50%;bottom:2.2%;transform:translateX(-50%);z-index:190;background:#0b213ef2;border:2px solid #ffd84e;color:#fff;padding:.8% 1.4%;border-radius:13px;font-weight:900;font-size:clamp(11px,1.05vw,18px);opacity:0;pointer-events:none;transition:opacity .18s}#toast.show{opacity:1}
#hud{position:absolute;right:4.5%;top:1.2%;z-index:45;display:none;gap:.55vw;align-items:center}.hudpill{background:#06162ce8;border:2px solid #234b77;border-radius:11px;padding:.42vw .7vw;font-weight:1000;font-size:clamp(10px,1.08vw,19px);box-shadow:0 4px 0 #020915;white-space:nowrap}.hudpill b{color:#fff}.hudpill span{margin-right:.3em}.plus{display:inline-grid;place-items:center;margin-left:.45em;background:#49d719;color:#fff;border-radius:5px;width:1.35em;height:1.35em;box-shadow:0 2px 0 #126a0b}
#loginForm{display:none;position:absolute;z-index:40;left:42.0%;top:30.8%;width:29.6%;height:26.2%}#login.active~#loginForm{display:block}.field{position:absolute;left:0;width:100%;height:27%;border:0;background:transparent;color:#fff;font-weight:800;font-size:clamp(12px,1.18vw,22px);padding:0 7%;outline:none}.field::placeholder{color:#dbe8ffb0}.field.user{top:0}.field.pass{top:43%}
/* secondary game pages */
.game-page{position:absolute;inset:0;display:grid;grid-template-columns:15.2% 1fr;background:linear-gradient(135deg,#071a34,#0e4f98);overflow:hidden}.game-side{background:linear-gradient(#071a34,#0b2a53);border-right:3px solid #265f98;padding:2.1% 1.2%;display:flex;flex-direction:column;gap:1.0%;overflow:auto}.game-logo{text-align:center;font-weight:1000;font-size:clamp(18px,2.4vw,40px);line-height:.86;margin:0 0 6%;text-shadow:0 4px #000}.game-logo span{display:block;color:#ffad22}.navbtn{border:2px solid #071221;border-radius:12px;background:linear-gradient(#2c78bf,#133b70);box-shadow:0 4px 0 #06152a;color:#fff;font-weight:1000;font-size:clamp(10px,1vw,18px);padding:6.5% 4%;cursor:pointer}.navbtn.active,.navbtn:hover{background:linear-gradient(#ffe25a,#f2a918);color:#07172d}.game-main{position:relative;padding:2.7% 3.0%;overflow:auto;background:radial-gradient(circle at 75% 10%,#2e8ce633,transparent 32%)}
.page-head{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #ffffff25;padding-bottom:1.2%;margin-bottom:1.8%}.page-head h1{margin:0;font-size:clamp(25px,3vw,52px);text-shadow:0 4px #000}.backbtn{border:0;border-radius:12px;background:#ffd83d;color:#082042;font-weight:1000;padding:.8em 1.1em;cursor:pointer;box-shadow:0 4px 0 #ad7610}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.4%}.card{min-height:180px;border:2px solid #4b8ac6;border-radius:18px;background:linear-gradient(145deg,#17487f,#0b274e);padding:5%;box-shadow:0 10px 24px #0004}.card h3{font-size:clamp(17px,1.55vw,28px);margin:.1em 0 .45em}.card p{color:var(--muted);font-weight:700}.action{border:0;border-radius:11px;background:linear-gradient(#39e45b,#17a83b);box-shadow:0 4px 0 #075e27;color:#fff;font-weight:1000;padding:.8em 1.1em;cursor:pointer}.action.gold{background:linear-gradient(#ffe75a,#f2a918);box-shadow:0 4px 0 #9b5f00;color:#0a1e36}.action.purple{background:linear-gradient(#c74cff,#7b14d9);box-shadow:0 4px 0 #460078}.action:active,.backbtn:active,.navbtn:active{transform:translateY(2px)}
.statbar{display:grid;grid-template-columns:repeat(4,1fr);gap:1%;margin-bottom:2%}.stat{background:#061c39;border:2px solid #3d79b7;border-radius:12px;text-align:center;padding:1.2%;font-weight:900}.stat b{color:#ffd83d;font-size:1.25em}.list{display:grid;gap:1.1%}.rowitem{display:flex;align-items:center;justify-content:space-between;gap:2%;background:#0c315c;border:2px solid #4b8ac6;border-radius:14px;padding:1.25% 1.6%;font-weight:900}.avatar{width:54px;height:54px;border-radius:12px;background:linear-gradient(145deg,#14b8ff,#6b42ff);display:grid;place-items:center;font-size:29px}.toggle{display:flex;align-items:center;gap:12px}.toggle input{width:26px;height:26px}
/* brawler custom */
.brawler-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.2%;align-items:stretch}.brawler-card{position:relative;min-height:180px;border:3px solid #07152c;border-radius:16px;padding:5%;overflow:hidden;cursor:pointer;box-shadow:0 7px 0 #06152a}.brawler-card.locked{filter:saturate(.35);opacity:.75}.brawler-card strong{font-size:clamp(18px,1.45vw,27px)}.brawler-card .emoji{font-size:clamp(60px,7vw,120px);text-align:center;display:block}.badge{position:absolute;right:8px;top:8px;background:#081a34;border:2px solid #ffd83d;border-radius:9px;padding:5px 8px;font-weight:1000}.rarity-legend{background:linear-gradient(145deg,#663bb1,#7b2cd5)}.rarity-epic{background:linear-gradient(145deg,#b43670,#d23f65)}.rarity-super{background:linear-gradient(145deg,#1588c8,#15b2e9)}.rarity-rare{background:linear-gradient(145deg,#178f55,#24b96a)}
/* reward animation */
#rewardOverlay{position:absolute;inset:0;z-index:200;display:none;place-items:center;background:radial-gradient(circle at 50% 45%,#204b9ce8,#031025f7);overflow:hidden}#rewardOverlay.show{display:grid}.reward-stage{text-align:center;max-width:86%;animation:rewardIn .55s cubic-bezier(.2,1.2,.2,1)}.reward-title{font-size:clamp(32px,5vw,90px);font-weight:1000;text-shadow:0 6px #000}.reward-orb{margin:2vh auto;width:min(26vw,300px);aspect-ratio:1;border-radius:26%;display:grid;place-items:center;font-size:clamp(70px,11vw,170px);font-weight:1000;background:linear-gradient(145deg,#5ef,#704cff,#ff51dd);box-shadow:0 0 70px #6af,0 20px 60px #000;animation:shake .55s ease-in-out 2}.reward-orb.box{border-radius:18%;background:linear-gradient(145deg,#f9b324,#1759d8,#ffd34e)}.reward-items{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:2vh auto}.reward-pill{background:#0b2a53;border:2px solid #6db7ff;border-radius:14px;padding:10px 16px;font-weight:1000;animation:pop .35s backwards}.reward-close{border:0;border-radius:14px;background:#ffd83d;color:#071a34;padding:14px 28px;font-weight:1000;font-size:18px;cursor:pointer}@keyframes rewardIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}@keyframes shake{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-5deg) scale(1.05)}75%{transform:rotate(5deg) scale(1.05)}}@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.8)}to{opacity:1;transform:none}}
#portrait{display:none;position:fixed;inset:0;background:linear-gradient(160deg,#07172e,#123b73);z-index:300;color:#fff;place-items:center;text-align:center;padding:28px}#portrait .cardp{max-width:420px;background:#0a2448;border:3px solid #67a8eb;border-radius:24px;padding:28px;box-shadow:0 20px 60px #0008}#portrait b{font-size:30px;display:block;margin-bottom:10px;color:#ffe15b}#portrait span{font-size:18px;line-height:1.5}

.play-screen{position:absolute;inset:0;background:radial-gradient(circle at 50% 28%,#1975d8 0,#0d4a91 35%,#08274e 72%,#061a34 100%);color:#fff;overflow:hidden}.play-top{height:11%;display:grid;grid-template-columns:100px 1fr 100px;align-items:center;padding:0 2%;background:#061a35;border-bottom:4px solid #0e3767;box-shadow:0 6px 20px #0007}.play-title{text-align:center;font-size:clamp(28px,3.5vw,62px);font-weight:1000;letter-spacing:.03em;text-shadow:0 5px #000}.play-back,.play-menu{border:3px solid #0a1427;border-radius:16px;background:linear-gradient(#2f7ac2,#17457d);color:#fff;font-size:clamp(24px,2.4vw,44px);font-weight:1000;padding:.25em .5em;box-shadow:0 5px 0 #06111f;cursor:pointer}.play-body{height:89%;display:grid;grid-template-columns:29% 42% 29%;gap:1.6%;padding:2.2%}.play-left{display:grid;gap:3%;align-content:center}.mode-card{min-height:120px;border:4px solid #07162c;border-radius:22px;background:linear-gradient(145deg,#174f8e,#0c2e59);box-shadow:0 7px 0 #041326;display:grid;grid-template-columns:82px 1fr 48px;align-items:center;padding:4%;cursor:pointer}.mode-card.selected{background:linear-gradient(145deg,#1c9c52,#106b38)}.mode-card b{display:block;font-size:clamp(18px,1.55vw,30px)}.mode-card span{display:block;color:#d9eaff;font-weight:800;margin-top:4px}.mode-icon{width:62px;height:62px;border-radius:16px;background:#2ecb67;display:grid;place-items:center;font-size:38px;border:3px solid #07162c}.mode-icon.gem{background:#9e46e8}.mode-icon.red{background:#d9434d}.mode-check{font-size:36px;color:#ffe14a}.play-center{display:grid;grid-template-rows:58% 1fr;gap:4%}.play-hero{border:4px solid #0a1730;border-radius:28px;background:radial-gradient(circle at 50% 35%,#36a4ff,#0d4f9d 45%,#09284e 100%);box-shadow:inset 0 0 50px #4cc0ff66,0 10px 30px #0007;display:flex;flex-direction:column;align-items:center;justify-content:center}.hero-avatar{font-size:clamp(95px,12vw,210px);filter:drop-shadow(0 14px 8px #0007)}.play-hero h2{font-size:clamp(24px,2.5vw,44px);margin:.1em 0}.play-hero p{margin:0;color:#ffd83d;font-weight:1000}.room-panel{border:4px solid #07162c;border-radius:22px;background:linear-gradient(145deg,#183f71,#0b2649);padding:4%;box-shadow:0 7px 0 #041326}.room-panel b{font-size:clamp(17px,1.4vw,26px);display:block}.room-panel span{display:block;color:#bcd8f5;font-weight:700;margin:.3em 0 .8em}.room-row{display:flex;gap:10px}.room-row input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:3px solid #347dc4;background:#061a35;color:#fff;font-weight:900}.room-panel>.action{width:100%;margin-top:12px}.play-right{display:flex;flex-direction:column;justify-content:center;gap:5%}.big-play{border:4px solid #0a1426;border-radius:26px;background:linear-gradient(#ffe65b,#ffb412);color:#071c39;font-size:clamp(36px,4vw,72px);font-weight:1000;padding:.9em .3em;box-shadow:0 10px 0 #a45e00,0 18px 30px #0007;cursor:pointer;text-shadow:0 2px #fff8}.training-btn{border:4px solid #07162c;border-radius:20px;background:linear-gradient(#45e865,#14ad3d);color:#fff;font-size:clamp(22px,2vw,38px);font-weight:1000;padding:.75em;box-shadow:0 7px 0 #075b28;cursor:pointer}.big-play:active,.training-btn:active,.play-back:active,.play-menu:active{transform:translateY(3px)}
@media (orientation:portrait) and (max-width:900px){#portrait{display:grid}}@media(max-width:900px){.game-page{grid-template-columns:20% 1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.brawler-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="app" aria-label="Lessing Stars">
<section id="home" class="screen active"><img class="bg" src="assets/visual/home.png" alt="Lessing Stars Lobby"></section>
<section id="shop" class="screen"><img class="bg" src="assets/visual/shop.png" alt="Lessing Stars Shop"></section>
<section id="brawler" class="screen"><img class="bg" src="assets/visual/brawler.png" alt="Lessing Stars Brawler"></section>
<section id="drops" class="screen"><img class="bg" src="assets/visual/drops.png" alt="Lessing Stars L-Drops und Mega-Boxen"></section>
<section id="login" class="screen"><img class="bg" src="assets/visual/login.png" alt="Lessing Stars Anmeldung"></section>
<section id="quick" class="screen"><img class="bg" src="assets/visual/quick.png" alt="Lessing Stars Schnellmenü"></section>
<section id="pass" class="screen"></section><section id="quests" class="screen"></section><section id="friends" class="screen"></section><section id="club" class="screen"></section><section id="profile" class="screen"></section><section id="settings" class="screen"></section><section id="skins" class="screen"></section><section id="events" class="screen"></section><section id="play" class="screen"></section>
<form id="loginForm" autocomplete="off"><input class="field user" name="user" aria-label="Benutzername" placeholder="Dein Benutzername ..."><input class="field pass" type="password" name="pass" aria-label="Passwort" placeholder="Dein Passwort ..."></form>
<div id="hud" aria-live="polite"></div><div id="toast" role="status"></div><div id="rewardOverlay" aria-live="polite"></div>
</div>
<div id="portrait"><div class="cardp"><b>Bitte Gerät drehen</b><span>Lessing Stars ist für Querformat optimiert.</span></div></div>
<script>
'use strict';
const app=document.getElementById('app');
const screens=[...document.querySelectorAll('.screen')];
const defaultState={coins:1500,gems:100,power:1000,tickets:45,trophies:0,drops:2,boxes:1,skin:'Klassisch',selectedBrawler:'Hamza.S.',owned:['Hamza.S.'],dailyClaimed:false,quests:{matches:0,wins:0,kos:0},claimedPath:[]};
let state;
try{state={...defaultState,...JSON.parse(localStorage.getItem('lessingStarsState')||'{}')}}catch(e){state={...defaultState}}
if(!Array.isArray(state.owned))state.owned=['Hamza.S.'];if(!state.owned.includes('Hamza.S.'))state.owned.unshift('Hamza.S.');
const save=()=>localStorage.setItem('lessingStarsState',JSON.stringify(state));
const toast=t=>{const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>el.classList.remove('show'),1900)};
const btn=(x,y,w,h,fn,label='')=>{const b=document.createElement('button');b.type='button';b.className='hot';Object.assign(b.style,{left:x+'%',top:y+'%',width:w+'%',height:h+'%'});b.setAttribute('aria-label',label);b.addEventListener('click',fn);app.appendChild(b);return b};
const clearHot=()=>document.querySelectorAll('.hot').forEach(x=>x.remove());
function updateHud(id){const hud=document.getElementById('hud');const showHud=['shop','brawler','drops','quick'].includes(id);hud.style.display=showHud?'flex':'none';if(!showHud)return;hud.innerHTML=`<div class="hudpill"><span>🪙</span><b>${state.coins}</b></div><div class="hudpill"><span>💎</span><b>${state.gems}</b></div><div class="hudpill"><span>⚡</span><b>${state.power}</b></div><div class="hudpill"><span>🎫</span><b>${state.tickets}</b></div>`}
function show(id){if(!document.getElementById(id))id='home';screens.forEach(s=>s.classList.toggle('active',s.id===id));if(!['home','shop','brawler','drops','login','quick'].includes(id))renderPage(id);installHotspots(id);updateHud(id)}
function coach(){try{parent.postMessage({type:'lessing-coach-home'},location.origin)}catch(e){location.href='./index.html'}}
function visualNav(y,id,label){btn(0.4,y,14.0,8.2,()=>show(id),label)}
function homeSpots(){
 btn(1.0,21.0,13.6,8.9,()=>show('shop'),'Shop');btn(1.0,30.8,13.6,8.9,()=>show('brawler'),'Brawler');btn(1.0,40.6,13.6,8.9,()=>show('pass'),'Pass');btn(1.0,50.4,13.6,8.9,()=>show('quests'),'Quests');btn(1.0,60.2,13.6,8.9,()=>show('friends'),'Freunde');btn(1.0,70.0,13.6,8.9,()=>show('club'),'Club');btn(1.0,79.8,13.6,8.9,()=>show('profile'),'Profil');btn(1.0,89.0,13.6,8.4,()=>show('settings'),'Einstellungen');
 btn(90.1,16.0,8.5,15.2,()=>show('events'),'Events');btn(90.1,34.0,8.5,15.2,()=>show('friends'),'Freunde');btn(90.1,53.0,8.5,15.2,()=>show('club'),'Club');
 btn(93.9,1.8,4.8,8.1,()=>show('quick'),'Menü');btn(15.5,81.8,11.5,14.0,claimDaily,'Tägliche Belohnung');btn(28.0,80.4,14.6,15.0,()=>selectMode('Showdown'),'Showdown');btn(43.0,80.4,14.6,15.0,()=>selectMode('Juwelenjagd'),'Juwelenjagd');btn(58.0,80.4,14.6,15.0,()=>selectMode('Kontrolle'),'Kontrolle');btn(74.0,78.4,23.5,18.6,()=>show('play'),'Spielen')}
function shopSpots(){btn(0,0,8.5,10,()=>show('home'),'Lobby');visualNav(10.8,'shop','Shop');visualNav(21.0,'brawler','Brawler');visualNav(31.2,'skins','Skins');visualNav(41.4,'play','Math Game');visualNav(51.6,'profile','Ressourcen');visualNav(61.8,'settings','Sonstiges');btn(15.5,17.0,22.5,69,()=>buyBundle(),'Starter-Paket');btn(39.0,17.0,18.5,69,()=>buySkin('Lessing-Hero',149),'Skin');btn(58.0,17.0,17.5,69,()=>buyBrawler('Prof. Zahl',349),'Brawler-Angebot');btn(76.0,18.0,23.0,69,()=>toast('Tägliche Angebote geöffnet'),'Tägliche Angebote')}
function brawlerSpots(){btn(0,0,8.8,10,()=>show('home'),'Lobby');visualNav(30,'shop','Shop');visualNav(40,'brawler','Brawler');visualNav(50,'skins','Skins');visualNav(60,'profile','Ressourcen');visualNav(70,'quests','Quests');visualNav(80,'club','Club');visualNav(90,'settings','Sonstiges');for(let r=0;r<3;r++)for(let c=0;c<3;c++)btn(16.4+c*17.5,20+r*27,16.3,24,()=>toast('Brawler ausgewählt'),'Brawler auswählen');btn(67.0,84.0,30.0,10.0,upgradeBrawler,'Upgrade')}
function dropsSpots(){btn(0,0,8.5,10,()=>show('home'),'Lobby');visualNav(10.2,'shop','Shop');visualNav(18.7,'brawler','Brawler');visualNav(27.2,'skins','Skins');visualNav(35.7,'drops','L-Drop');visualNav(44.2,'drops','Mega Box');visualNav(52.7,'quests','Belohnungen');visualNav(61.2,'quests','Quests');visualNav(69.7,'friends','Freunde');visualNav(78.2,'club','Club');visualNav(86.7,'profile','Profil');btn(21.0,82.0,27.0,11.0,()=>openReward('L-Drop'),'L-Drop öffnen');btn(61.0,82.0,27.0,11.0,()=>openReward('Mega-Box'),'Mega-Box öffnen')}
function loginSpots(){btn(36.0,55.0,35.0,11.0,()=>{const u=document.querySelector('.field.user').value.trim();if(!u)return toast('Bitte Benutzername eingeben');toast('Angemeldet');show('home')},'Anmelden');btn(36.2,68.0,17.0,9.5,()=>show('home'),'Gast spielen');btn(54.0,68.0,17.0,9.5,()=>toast('Passwort-Hilfe geöffnet'),'Passwort vergessen');btn(36.0,82.0,35.0,9.5,()=>toast('Kontoerstellung geöffnet'),'Neues Konto')}
function quickSpots(){btn(93.0,1.2,6.0,9.0,()=>show('home'),'Schließen');btn(70.2,15.2,27.0,8.8,()=>show('login'),'Anmelden');btn(70.2,24.6,27.0,8.8,()=>show('settings'),'Einstellungen');btn(70.2,34.0,27.0,8.8,()=>toast('Keine neuen Nachrichten'),'Post');btn(70.2,43.4,27.0,8.8,()=>toast('Hilfe geöffnet'),'Hilfe');btn(70.2,52.8,27.0,8.8,()=>toast('Support geöffnet'),'Support');btn(70.2,62.2,27.0,8.8,()=>toast('Datenschutz geöffnet'),'Datenschutz');btn(70.2,71.6,27.0,8.8,()=>toast('Sprache: Deutsch'),'Sprache');btn(70.2,81.0,27.0,8.8,()=>show('login'),'Abmelden');btn(1.5,1.5,24.0,8.5,coach,'Zurück zum Terminplaner')}
function installHotspots(id){clearHot();const map={home:homeSpots,shop:shopSpots,brawler:brawlerSpots,drops:dropsSpots,login:loginSpots,quick:quickSpots};(map[id]||(()=>{}))()}
function claimDaily(){if(state.dailyClaimed)return toast('Tägliche Belohnung bereits abgeholt');state.dailyClaimed=true;state.coins+=200;state.drops+=1;save();updateHud('home');toast('+200 Münzen und +1 L-Drop')}
function selectMode(name){state.mode=name;save();toast(name+' ausgewählt')}
function buyBundle(){if(state.gems<10)return toast('Nicht genug Juwelen');state.gems-=10;state.coins+=2000;state.boxes+=3;save();updateHud('shop');toast('Starter-Paket erhalten!')}
function buySkin(name,cost){if(state.skin===name)return toast('Bereits ausgewählt');if(state.gems<cost)return toast('Nicht genug Juwelen');state.gems-=cost;state.skin=name;save();updateHud('shop');toast(name+' gekauft!')}
function buyBrawler(name,cost){if(state.owned.includes(name))return toast(name+' bereits freigeschaltet');if(state.gems<cost)return toast('Nicht genug Juwelen');state.gems-=cost;state.owned.push(name);state.selectedBrawler=name;save();updateHud('shop');toast(name+' freigeschaltet!')}
function upgradeBrawler(){if(state.coins<400)return toast('Nicht genug Münzen');if(state.power<20)return toast('Nicht genug Powerpunkte');state.coins-=400;state.power-=20;save();updateHud('brawler');toast('Brawler verbessert!')}
const rewardPool=[{t:'🪙 150 Münzen',k:'coins',v:150},{t:'💎 8 Juwelen',k:'gems',v:8},{t:'⚡ 120 Powerpunkte',k:'power',v:120},{t:'🎫 2 Tickets',k:'tickets',v:2},{t:'🏆 15 Trophäen',k:'trophies',v:15},{t:'🎨 Skin-Teil',k:null,v:0},{t:'⭐ 25 Credits',k:null,v:0}];
function openReward(kind){if(kind==='L-Drop'){if(state.drops<1)return toast('Kein L-Drop vorhanden');state.drops--}else{if(state.boxes<1)return toast('Keine Mega-Box vorhanden');state.boxes--}
 const roll=Math.random(),rarity=roll<.01?'LEGENDÄR':roll<.05?'MYTHISCH':roll<.15?'EPISCH':roll<.40?'SUPERSELTEN':'SELTEN';const count=kind==='Mega-Box'?(4+Math.floor(Math.random()*5)):(rarity==='LEGENDÄR'?(1+Math.floor(Math.random()*3)):1);const items=Array.from({length:count},()=>rewardPool[Math.floor(Math.random()*rewardPool.length)]);items.forEach(i=>{if(i.k)state[i.k]+=i.v});save();
 const o=document.getElementById('rewardOverlay');o.innerHTML=`<div class="reward-stage"><div class="reward-title">${kind}</div><div class="reward-orb ${kind==='Mega-Box'?'box':''}">${kind==='Mega-Box'?'🎁':'L'}</div><div style="font-weight:1000;color:#ffe25b;font-size:clamp(18px,2.6vw,42px)">${rarity}</div><div class="reward-items">${items.map((x,i)=>`<div class="reward-pill" style="animation-delay:${i*.1}s">${x.t}</div>`).join('')}</div><button class="reward-close">WEITER</button></div>`;o.classList.add('show');o.querySelector('.reward-close').onclick=()=>{o.classList.remove('show');show('drops')};updateHud('drops')}
function shell(title,body,active){const nav=[['home','LOBBY'],['shop','SHOP'],['brawler','BRAWLER'],['drops','L-DROPS'],['skins','SKINS'],['quests','QUESTS'],['friends','FREUNDE'],['club','CLUB'],['profile','PROFIL'],['settings','EINSTELLUNGEN']];return `<div class="game-page"><aside class="game-side"><div class="game-logo">LESSING<span>STARS</span></div>${nav.map(([id,l])=>`<button class="navbtn ${id===active?'active':''}" data-go="${id}">${l}</button>`).join('')}</aside><main class="game-main"><div class="page-head"><h1>${title}</h1><button class="backbtn" data-go="home">← LOBBY</button></div>${body}</main></div>`}
function renderPage(id){const s=document.getElementById(id);let html='';
 if(id==='pass')html=shell('BRAWL PASS',`<div class="statbar"><div class="stat">STUFE<br><b>1</b></div><div class="stat">TROPHÄEN<br><b>${state.trophies}</b></div><div class="stat">TICKETS<br><b>${state.tickets}</b></div><div class="stat">POWER<br><b>${state.power}</b></div></div><div class="cards">${[1,2,3,4,5,6].map((n,i)=>`<div class="card"><h3>Stufe ${n}</h3><p>${i%2?'Mega-Box':'L-Drop'} + Münzen</p><button class="action gold" data-reward="${i%2?'Mega-Box':'L-Drop'}">ABHOLEN</button></div>`).join('')}</div>`,'pass');
 if(id==='quests')html=shell('QUESTS & BELOHNUNGEN',`<div class="cards"><div class="card"><h3>3 Matches spielen</h3><p>${state.quests.matches||0} / 3</p><button class="action" data-q="matches">+ 200 Münzen</button></div><div class="card"><h3>1 Match gewinnen</h3><p>${state.quests.wins||0} / 1</p><button class="action" data-q="wins">+ 50 Powerpunkte</button></div><div class="card"><h3>5 Gegner besiegen</h3><p>${state.quests.kos||0} / 5</p><button class="action" data-q="kos">+ 1 L-Drop</button></div></div><h2>Trophäenpfad</h2><div class="list">${[25,50,75,100,125,150,175,200,225,250].map(x=>`<div class="rowitem"><span>${x} Trophäen</span><button class="action gold" data-path="${x}">${state.claimedPath.includes(x)?'ABGEHOLT':'ABHOLEN'}</button></div>`).join('')}</div>`,'quests');
 if(id==='friends')html=shell('FREUNDE',`<div class="card"><h3>Freunde hinzufügen</h3><p>Freund-Code eingeben oder einen eigenen Raum erstellen.</p><div style="display:flex;gap:12px"><input id="friendCode" placeholder="Freund-Code" style="flex:1;padding:14px;border-radius:12px;border:2px solid #4b8ac6;background:#071d3d;color:#fff"><button class="action" id="addFriend">HINZUFÜGEN</button></div></div><br><div class="list">${['Spieler 1','Spieler 2','Spieler 3'].map((n,i)=>`<div class="rowitem"><span style="display:flex;align-items:center;gap:12px"><span class="avatar">${i%2?'👧':'👦'}</span>${n}<small style="color:#6cff90"> • online</small></span><button class="action" data-invite> EINLADEN </button></div>`).join('')}</div>`,'friends');
 if(id==='club')html=shell('CLUB',`<div class="card"><h3>Lessing Stars Club</h3><p>Gemeinsam spielen, Punkte sammeln und Club-Belohnungen freischalten.</p><div class="statbar"><div class="stat">MITGLIEDER<br><b>12/30</b></div><div class="stat">CLUB-PUNKTE<br><b>1.840</b></div><div class="stat">RANG<br><b>Silber</b></div><div class="stat">ONLINE<br><b>3</b></div></div><button class="action gold" id="clubOpen">CLUB ÖFFNEN</button></div>`,'club');
 if(id==='profile')html=shell('PROFIL',`<div class="cards"><div class="card"><div class="avatar" style="width:100px;height:100px;font-size:60px">🎓</div><h3>Spielerprofil</h3><p>Trophäen: ${state.trophies}</p><p>Ausgewählter Brawler: ${state.selectedBrawler}</p></div><div class="card"><h3>Ressourcen</h3><p>🪙 ${state.coins} Münzen</p><p>💎 ${state.gems} Juwelen</p><p>⚡ ${state.power} Powerpunkte</p><p>🎫 ${state.tickets} Tickets</p></div><div class="card"><h3>Aktiver Skin</h3><p>${state.skin}</p><button class="action purple" data-go="skins">SKINS</button></div></div>`,'profile');
 if(id==='settings')html=shell('EINSTELLUNGEN',`<div class="list"><label class="rowitem">Musik <span class="toggle"><input type="checkbox" checked></span></label><label class="rowitem">Soundeffekte <span class="toggle"><input type="checkbox" checked></span></label><label class="rowitem">Animationen <span class="toggle"><input type="checkbox" checked></span></label><div class="rowitem"><span>Sprache</span><button class="action">Deutsch</button></div><div class="rowitem"><span>Terminplaner</span><button id="coachBack" class="action gold">ZURÜCK ZUM TERMINPLANER</button></div><div class="rowitem"><span>Spielstand</span><button id="resetGame" class="action">ZURÜCKSETZEN</button></div></div>`,'settings');
 if(id==='skins')html=shell('SKINS',`<div class="cards">${['Klassisch','Neonblau','Gold','Violett','Jade','Lessing-Hero'].map((n,i)=>`<div class="card"><div class="avatar" style="width:100%;height:110px;font-size:64px">${['🎓','💙','👑','💜','💚','⭐'][i]}</div><h3>${n}</h3><p>${state.skin===n?'Ausgewählt':(n==='Lessing-Hero'?'149 Juwelen':'50 Juwelen')}</p><button class="action ${state.skin===n?'':'purple'}" data-skin="${n}" data-cost="${n==='Lessing-Hero'?149:50}">${state.skin===n?'AUSGEWÄHLT':'KAUFEN / AUSWÄHLEN'}</button></div>`).join('')}</div>`,'skins');
 if(id==='events')html=shell('EVENTS',`<div class="cards"><div class="card"><h3>Schulhof-Chaos</h3><p>Showdown · täglich</p><button class="action gold" data-mode="Showdown">SPIELEN</button></div><div class="card"><h3>Wissensmine</h3><p>Juwelenjagd · Event</p><button class="action gold" data-mode="Juwelenjagd">SPIELEN</button></div><div class="card"><h3>Aula-Arena</h3><p>Kontrolle · Event</p><button class="action gold" data-mode="Kontrolle">SPIELEN</button></div></div>`,'events');
 if(id==='play')html=`<div class="play-screen">
  <div class="play-top"><button class="play-back" data-go="home">←</button><div class="play-title">SPIELEN</div><button class="play-menu" data-go="quick">☰</button></div>
  <div class="play-body">
    <div class="play-left">
      <div class="mode-card selected"><div class="mode-icon">☠</div><div><b>${state.mode||'SHOWDOWN'}</b><span>Schulhof-Chaos</span></div><div class="mode-check">✓</div></div>
      <div class="mode-card" data-mode="Juwelenjagd"><div class="mode-icon gem">◆</div><div><b>JUWELENJAGD</b><span>Wissensmine</span></div></div>
      <div class="mode-card" data-mode="Kontrolle"><div class="mode-icon red">⬟</div><div><b>KONTROLLE</b><span>Aula-Arena</span></div></div>
    </div>
    <div class="play-center">
      <div class="play-hero"><div class="hero-avatar">🎓</div><h2>${state.selectedBrawler}</h2><p>POWER 1</p></div>
      <div class="room-panel"><div><b>MIT FREUNDEN SPIELEN</b><span>Raumcode eingeben oder eigenen Raum erstellen</span></div><div class="room-row"><input id="roomCode" placeholder="ABC123"><button class="action" id="joinRoom">BEITRETEN</button></div><button class="action purple" id="createRoom">RAUM ERSTELLEN</button></div>
    </div>
    <div class="play-right">
      <button class="big-play" id="quickPlay">SPIELEN</button>
      <button class="training-btn" id="training">TRAINING</button>
    </div>
  </div>
</div>`;
 s.innerHTML=html;wireRendered(s,id)}
function wireRendered(s,id){s.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));s.querySelectorAll('[data-reward]').forEach(b=>b.onclick=()=>{const k=b.dataset.reward==='L-Drop'?'drops':'boxes';state[k]++;save();openReward(b.dataset.reward)});s.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{const n=b.dataset.skin,c=Number(b.dataset.cost||50);if(state.skin===n)return toast('Bereits ausgewählt');if(state.gems<c)return toast('Nicht genug Juwelen');state.gems-=c;state.skin=n;save();renderPage('skins');toast(n+' ausgewählt')});s.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;save();show('play')});s.querySelectorAll('[data-invite]').forEach(b=>b.onclick=()=>toast('Einladung gesendet'));
 s.querySelectorAll('[data-path]').forEach(b=>b.onclick=()=>{const x=Number(b.dataset.path);if(state.claimedPath.includes(x))return toast('Bereits abgeholt');if(state.trophies<x)return toast('Noch nicht genug Trophäen');state.claimedPath.push(x);state.coins+=200;save();renderPage('quests');toast('+200 Münzen')});
 const cb=s.querySelector('#coachBack');if(cb)cb.onclick=coach;const rg=s.querySelector('#resetGame');if(rg)rg.onclick=()=>{state=structuredClone(defaultState);save();toast('Spielstand zurückgesetzt');show('settings')};const qp=s.querySelector('#quickPlay');if(qp)qp.onclick=()=>simulateMatch();const tr=s.querySelector('#training');if(tr)tr.onclick=()=>simulateMatch(true);const cr=s.querySelector('#createRoom');if(cr)cr.onclick=()=>toast('Raum erstellt: '+Math.random().toString(36).slice(2,8).toUpperCase());const jr=s.querySelector('#joinRoom');if(jr)jr.onclick=()=>{const c=s.querySelector('#roomCode').value.trim();toast(c?'Raum '+c+' wird geöffnet':'Bitte Code eingeben')};const af=s.querySelector('#addFriend');if(af)af.onclick=()=>{const c=s.querySelector('#friendCode').value.trim();toast(c?'Freundesanfrage gesendet':'Bitte Freund-Code eingeben')};const co=s.querySelector('#clubOpen');if(co)co.onclick=()=>toast('Club geöffnet')}
function simulateMatch(training=false){toast(training?'Training startet …':'Matchmaking läuft …');setTimeout(()=>{state.quests.matches=(state.quests.matches||0)+1;state.quests.kos=(state.quests.kos||0)+Math.floor(Math.random()*5);if(Math.random()>.45)state.quests.wins=(state.quests.wins||0)+1;state.trophies+=training?0:8+Math.floor(Math.random()*9);save();toast(training?'Training beendet':'Match beendet · Trophäen erhalten')},900)}
installHotspots('home');updateHud('home');window.addEventListener('keydown',e=>{if(e.key==='Escape')show('home')});
</script>
</body></html>
